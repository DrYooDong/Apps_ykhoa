<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân loại Rối loạn nhịp tim | CliniPortal</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/pathology-matrix.css">
    <link rel="stylesheet" href="../css/components/flowchart.css">
</head>
<body>
    <div id="header-placeholder" data-header-path="../components/header.html"></div>

    <main class="container">
        <header class="page-header">
            <h1>Tiếp cận và Phân loại Rối loạn nhịp tim (ECG)</h1>
            <p class="page-description">Sơ đồ thuật toán chẩn đoán phân biệt loạn nhịp từ cơ bản đến các ca hiếm, khó.</p>
        </header>

        <div id="content-container"></div>

        <section class="flowchart-board" id="arrhythmia-board">
            <h2>Bản đồ Phân loại ECG (Tương tác)</h2>
            <div id="flowchart-render-area" style="width: 100%; min-height: 600px;"></div>
        </section>

        <section class="redflag-panel" id="redflag-panel" style="margin-top: 24px; padding: 16px; border-left: 4px solid var(--color-danger); background: var(--color-surface);">
            <h3>Cảnh báo Dấu hiệu Hiếm gặp (Red Flags)</h3>
            <ul id="redflag-list"></ul>
        </section>

        <section class="mini-calculator" id="qtc-tool" style="margin-top: 20px; padding: 16px; border-left: 4px solid var(--color-primary);">
            <h3>Công cụ tính nhanh QTc (Bazett)</h3>
            <label>Khoảng QT (ms): <input type="number" id="qt-input"></label>
            <label>Khoảng RR (ms): <input type="number" id="rr-input"></label>
            <button onclick="calculateQTc()">Tính QTc</button>
            <span id="qtc-result" style="font-weight: bold; margin-left: 10px;"></span>
        </section>
    </main>

    <div id="footer-placeholder" data-footer-path="../components/footer.html"></div>

    <script src="../js/main.js"></script>
    <script src="../../src/core/content-loader.js"></script>
    <script src="../../js/flowchart.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            ContentLoader.loadMarkdown('../../src/content/approaches/roi-loan-nhip-tim.md', 'content-container');

            fetch('../../src/content/approaches/roi-loan-nhip-flowchart.json')
                .then(res => res.json())
                .then(data => {
                    FlowchartEngine.render('flowchart-render-area', data);
                    renderRedFlags(data);
                });
        });

        function renderRedFlags(data) {
            const list = document.getElementById('redflag-list');
            const flagIds = (data.redFlagsPanel || []).map(f => f.id);
            data.nodes.filter(n => flagIds.includes(n.id)).forEach(n => {
                const li = document.createElement('li');
                li.textContent = n.label;
                list.appendChild(li);
            });
        }

        function calculateQTc() {
            const qt = parseFloat(document.getElementById('qt-input').value);
            const rr = parseFloat(document.getElementById('rr-input').value);
            const resultEl = document.getElementById('qtc-result');
            if (qt && rr) {
                const qtc = qt / Math.sqrt(rr / 1000);
                resultEl.innerText = `QTc: ${qtc.toFixed(0)} ms`;
                if (qtc > 450) {
                    resultEl.style.color = "var(--color-danger)";
                    resultEl.innerText += " ⚠️ Nguy cơ QT dài";
                } else if (qtc < 340) {
                    resultEl.style.color = "var(--color-danger)";
                    resultEl.innerText += " ⚠️ Nguy cơ QT ngắn";
                } else {
                    resultEl.style.color = "var(--color-success)";
                }
            } else {
                resultEl.innerText = "Vui lòng nhập đủ QT và RR";
                resultEl.style.color = "var(--color-warning)";
            }
        }
    </script>
</body>
</html>
