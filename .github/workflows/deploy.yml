name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '.agents/**'
      - '.vscode/**'
      - 'archive/**'
      - 'docs/**'
      - '*.md'
      - 'tools/scratch/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '.agents/**'
      - '.vscode/**'
      - 'archive/**'
      - 'docs/**'
      - '*.md'
      - 'tools/scratch/**'
  workflow_dispatch:

# Allow one concurrent deployment, immediately cancelling any redundant in-progress runs when a new push occurs.
concurrency:
  group: 'pages'
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit || npm install --prefer-offline --no-audit
          if [ -f "src/content/docspace/package.json" ]; then npm --prefix src/content/docspace install --prefer-offline --no-audit; fi

      - name: Run automated quality gates (Typecheck, Linter, Tree-shake)
        run: npm run validate:all

      - name: Build project (Fast CI Mode)
        run: npm run build:ci

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Deploy job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
