<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" class="editorial-flowchart-svg" style="max-width: 960px; display: block; margin: 1.5rem auto; font-family: var(--font-sans, 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif); background: var(--color-surface, #ffffff); border: 1px solid var(--color-border, #e2e8f0); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); overflow: hidden;">
  <defs>
    <!-- Markers cho các loại mũi tên -->
    <marker id="arr-default" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-border, #94a3b8)" />
    </marker>
    <marker id="arr-primary" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-primary, #0284c7)" />
    </marker>
    <marker id="arr-danger" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-danger, #ef4444)" />
    </marker>
    <marker id="arr-success" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-success, #10b981)" />
    </marker>
    <marker id="arr-warning" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-warning, #f59e0b)" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-teal, #14b8a6)" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-purple, #a855f7)" />
    </marker>
  </defs>

  <style>
    .flowchart-node-rect { transition: all 0.2s ease; cursor: default; }
    .flowchart-node-rect:hover { filter: brightness(0.96); }
    [data-theme="dark"] .editorial-flowchart-svg {
      background: var(--color-surface, #0f172a) !important;
      border-color: var(--color-border, #1e293b) !important;
    }
    [data-theme="dark"] .flowchart-node-rect:hover { filter: brightness(1.1); }
  </style>

  <!-- Header Bar -->
  <g class="flowchart-header">
    <rect x="0" y="0" width="960" height="28" fill="var(--color-surface-2, #f8fafc)" border-bottom="1px solid var(--color-border, #e2e8f0)"/>
    <text x="20" y="18" font-size="11" font-weight="800" fill="var(--color-primary, #0284c7)" letter-spacing="0.5">PHÁC ĐỒ CẤP CỨU PHẢN VỆ (THÔNG TƯ 51/2017/TT-BYT)</text>
  </g>

  <!-- Edges Layer -->
  <g class="flowchart-edges">
    <path d="M 480 110 L 480 150" fill="none" stroke="var(--color-border, #cbd5e1)" stroke-width="1.75" marker-end="url(#arr-default)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 480 230 L 480 270" fill="none" stroke="var(--color-border, #cbd5e1)" stroke-width="1.75" marker-end="url(#arr-default)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 370 307.5 L 216 307.5 Q 210 307.5 210 313.5 L 210 390" fill="none" stroke="var(--color-danger, #ef4444)" stroke-width="1.75" marker-end="url(#arr-danger)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="236.5" y="297.5" width="107" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-danger, #ef4444)" stroke-width="1" />
      <text x="290" y="310.5" font-size="9" font-weight="800" fill="var(--color-danger, #ef4444)" text-anchor="middle" letter-spacing="0.3">KHÔNG ĐÁP ỨNG</text>
    </g>
    <path d="M 590 307.5 L 744 307.5 Q 750 307.5 750 313.5 L 750 390" fill="none" stroke="var(--color-success, #10b981)" stroke-width="1.75" marker-end="url(#arr-success)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="623.5" y="297.5" width="93" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-success, #10b981)" stroke-width="1" />
      <text x="670" y="310.5" font-size="9" font-weight="800" fill="var(--color-success, #10b981)" text-anchor="middle" letter-spacing="0.3">ĐÁP ỨNG TỐT</text>
    </g>
    <path d="M 210 480 L 210 515" fill="none" stroke="var(--color-border, #cbd5e1)" stroke-width="1.75" marker-end="url(#arr-default)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 750 480 L 750 515" fill="none" stroke="var(--color-border, #cbd5e1)" stroke-width="1.75" marker-end="url(#arr-default)" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Nodes Layer -->
  <g class="flowchart-nodes">
    <g class="node-group" id="node-start">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="360" y="40" width="240" height="70" rx="10" fill="var(--color-primary-hl, rgba(2, 132, 199, 0.08))" stroke="var(--color-primary, #0284c7)" stroke-width="1.5" />
      <rect x="372" y="50" width="66" height="16" rx="4" fill="var(--color-primary, #0284c7)" />
      <text x="405" y="61" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TIẾP NHẬN</text>
      <text x="372" y="78" font-size="12" font-weight="800" fill="var(--color-primary, #0284c7)">
        Nghi ngờ Phản vệ
      </text>
      <text x="372" y="94" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Tiếp xúc dị nguyên + Mày đay, phù
      </text>
      <text x="372" y="107" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        môi/mắt, khó thở, tụt HA
      </text>
    </g>
    <g class="node-group" id="node-adrenalin">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="340" y="150" width="280" height="80" rx="10" fill="var(--color-danger-hl, rgba(239, 68, 68, 0.08))" stroke="var(--color-danger, #ef4444)" stroke-width="2" />
      <rect x="352" y="160" width="84" height="16" rx="4" fill="var(--color-danger, #ef4444)" />
      <text x="394" y="171" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TỐI KHẨN CẤP</text>
      <text x="352" y="188" font-size="12" font-weight="800" fill="var(--color-danger, #dc2626)">
        ADRENALIN 1mg/1ml TIÊM BẮP
      </text>
      <text x="352" y="204" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Người lớn: 1/2 - 1 ống | Trẻ em: 1/5 -
      </text>
      <text x="352" y="217" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        1/3 ống (Mặt trước ngoài đùi)
      </text>
    </g>
    <g class="node-group" id="node-eval">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="370" y="270" width="220" height="75" rx="10" fill="var(--color-warning-hl, rgba(245, 158, 11, 0.08))" stroke="var(--color-warning, #f59e0b)" stroke-width="1.5" />
      <rect x="382" y="280" width="114" height="16" rx="4" fill="var(--color-warning, #f59e0b)" />
      <text x="439" y="291" font-size="8.5" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">ĐÁNH GIÁ 3-5 PHÚT</text>
      <text x="382" y="308" font-size="12" font-weight="800" fill="var(--color-warning, #d97706)">
        Đáp Ứng Lâm Sàng?
      </text>
      <text x="382" y="324" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Huyết áp cải thiện? Hết co thắt
      </text>
      <text x="382" y="337" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        phế quản, khó thở?
      </text>
    </g>
    <g class="node-group" id="node-refractory">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="80" y="390" width="260" height="90" rx="10" fill="var(--color-purple-hl, rgba(168, 85, 247, 0.08))" stroke="var(--color-purple, #a855f7)" stroke-width="1.5" />
      <rect x="92" y="400" width="150" height="16" rx="4" fill="var(--color-purple, #a855f7)" />
      <text x="167" y="411" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHƯA ĐÁP ỨNG / NẶNG HƠN</text>
      <text x="92" y="428" font-size="12" font-weight="800" fill="var(--color-purple, #9333ea)">
        Nhắc Lại Adrenalin &amp; Hồi Sức
      </text>
      <text x="92" y="444" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Tiêm bắp nhắc lại mỗi 3-5p + Lập 2
      </text>
      <text x="92" y="457" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        đường truyền TM ngoại vi + Truyền dịch
      </text>
      <text x="92" y="470" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        nhanh 1-2L
      </text>
    </g>
    <g class="node-group" id="node-infusion">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="80" y="515" width="260" height="80" rx="10" fill="var(--color-teal-hl, rgba(20, 184, 166, 0.08))" stroke="var(--color-teal, #14b8a6)" stroke-width="1.5" />
      <rect x="92" y="525" width="66" height="16" rx="4" fill="var(--color-teal, #14b8a6)" />
      <text x="125" y="536" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">KHÁNG TRỊ</text>
      <text x="92" y="553" font-size="12" font-weight="800" fill="var(--color-teal, #0d9488)">
        Truyền Adrenalin Liên Tục
      </text>
      <text x="92" y="569" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Bơm tiêm điện bắt đầu 0.1 mcg/kg/phút
      </text>
      <text x="92" y="582" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        + Đặt NKQ nếu suy hô hấp đe dọa
      </text>
    </g>
    <g class="node-group" id="node-supportive">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="620" y="390" width="260" height="90" rx="10" fill="var(--color-teal-hl, rgba(20, 184, 166, 0.08))" stroke="var(--color-teal, #14b8a6)" stroke-width="1.5" />
      <rect x="632" y="400" width="120" height="16" rx="4" fill="var(--color-teal, #14b8a6)" />
      <text x="692" y="411" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ỔN ĐỊNH HUYẾT ĐỘNG</text>
      <text x="632" y="428" font-size="12" font-weight="800" fill="var(--color-teal, #0d9488)">
        Điều Trị Hỗ Trợ &amp; Phối Hợp
      </text>
      <text x="632" y="444" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Nằm đầu bằng, chân cao + Thở Oxy +
      </text>
      <text x="632" y="457" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Diphenhydramine TM + Methylprednisolon
      </text>
      <text x="632" y="470" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        TM
      </text>
    </g>
    <g class="node-group" id="node-monitoring">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="620" y="515" width="260" height="80" rx="10" fill="var(--color-success-hl, rgba(16, 185, 129, 0.08))" stroke="var(--color-success, #10b981)" stroke-width="1.5" />
      <rect x="632" y="525" width="114" height="16" rx="4" fill="var(--color-success, #10b981)" />
      <text x="689" y="536" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">THEO DÕI NẰM VIỆN</text>
      <text x="632" y="553" font-size="12" font-weight="800" fill="var(--color-success, #059669)">
        Theo Dõi Tối Thiểu 24-48 Giờ
      </text>
      <text x="632" y="569" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Cảnh giác phản vệ pha 2 (Biphasic) +
      </text>
      <text x="632" y="582" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Cấp thẻ cảnh ứng và bút tiêm EpiPen
      </text>
    </g>
  </g>
</svg>
