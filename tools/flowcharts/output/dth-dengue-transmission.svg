<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" class="editorial-flowchart-svg" style="max-width: 960px; display: block; margin: 1.5rem auto; font-family: var(--font-sans, 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif); background: var(--color-surface, #ffffff); border: 1px solid var(--color-border, #e2e8f0); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); overflow: hidden;">
  <defs>
    <!-- Markers cho các loại mũi tên -->
    <marker id="arr-default" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-border, #94a3b8)" />
    </marker>
    <marker id="arr-primary" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-primary, #0284c7)" />
    </marker>
    <marker id="arr-danger" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-danger, #ef4444)" />
    </marker>
    <marker id="arr-success" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-success, #10b981)" />
    </marker>
    <marker id="arr-warning" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-warning, #f59e0b)" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-teal, #14b8a6)" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-purple, #a855f7)" />
    </marker>
  </defs>

  <style>
    .flowchart-node-rect { transition: all 0.2s ease; cursor: default; }
    .flowchart-node-rect:hover { filter: brightness(0.96); }
    [data-theme="dark"] .editorial-flowchart-svg {
      background: var(--color-surface, #0f172a) !important;
      border-color: var(--color-border, #1e293b) !important;
    }
    [data-theme="dark"] .flowchart-node-rect:hover { filter: brightness(1.1); }
  </style>

  <!-- Header Bar -->
  <g class="flowchart-header">
    <rect x="0" y="0" width="960" height="28" fill="var(--color-surface-2, #f8fafc)" border-bottom="1px solid var(--color-border, #e2e8f0)"/>
    <text x="20" y="18" font-size="11" font-weight="800" fill="var(--color-primary, #0284c7)" letter-spacing="0.5">CHU KỲ LÂY TRUYỀN VÉC-TƠ &amp; ĐỘNG THÁI BỆNH SINH DENGUE (DENV)</text>
  </g>

  <!-- Edges Layer -->
  <g class="flowchart-edges">
    <path d="M 600 75 L 749 75 Q 755 75 755 81 L 755 150" fill="none" stroke="var(--color-primary, #0284c7)" stroke-width="1.75" marker-end="url(#arr-primary)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="627.5" y="65" width="100" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-primary, #0284c7)" stroke-width="1" />
      <text x="677.5" y="78" font-size="9" font-weight="800" fill="var(--color-primary, #0284c7)" text-anchor="middle" letter-spacing="0.3">MUỖI HÚT MÁU</text>
    </g>
    <path d="M 755 230 L 755 275" fill="none" stroke="var(--color-primary, #0284c7)" stroke-width="1.75" marker-end="url(#arr-primary)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 620 312.5 L 620 435 L 600 435" fill="none" stroke="var(--color-primary, #0284c7)" stroke-width="1.75" marker-end="url(#arr-primary)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="570" y="425" width="100" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-primary, #0284c7)" stroke-width="1" />
      <text x="620" y="438" font-size="9" font-weight="800" fill="var(--color-primary, #0284c7)" text-anchor="middle" letter-spacing="0.3">TRUYỀN VIRUS</text>
    </g>
    <path d="M 360 435 L 201 435 Q 195 435 195 441 L 195 515" fill="none" stroke="var(--color-success, #10b981)" stroke-width="1.75" marker-end="url(#arr-success)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="196" y="425" width="163" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-success, #10b981)" stroke-width="1" />
      <text x="277.5" y="438" font-size="9" font-weight="800" fill="var(--color-success, #10b981)" text-anchor="middle" letter-spacing="0.3">ĐÁP ỨNG MIỄN DỊCH ĐẦU</text>
    </g>
    <path d="M 600 435 L 759 435 Q 765 435 765 441 L 765 515" fill="none" stroke="var(--color-danger, #ef4444)" stroke-width="1.75" marker-end="url(#arr-danger)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="594" y="425" width="177" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-danger, #ef4444)" stroke-width="1" />
      <text x="682.5" y="438" font-size="9" font-weight="800" fill="var(--color-danger, #ef4444)" text-anchor="middle" letter-spacing="0.3">TÁI NHIỄM KHÁC SEROTYPE</text>
    </g>
    <path d="M 480 395 L 480 110" fill="none" stroke="var(--color-primary, #0284c7)" stroke-width="1.75" marker-end="url(#arr-primary)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="374" y="242.5" width="212" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-primary, #0284c7)" stroke-width="1" />
      <text x="480" y="255.5" font-size="9" font-weight="800" fill="var(--color-primary, #0284c7)" text-anchor="middle" letter-spacing="0.3">HÌNH THÀNH Ổ VIRUS HUYẾT MỚI</text>
    </g>
  </g>

  <!-- Nodes Layer -->
  <g class="flowchart-nodes">
    <g class="node-group" id="node-viremia">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="360" y="40" width="240" height="70" rx="10" fill="var(--color-primary-hl, rgba(2, 132, 199, 0.08))" stroke="var(--color-primary, #0284c7)" stroke-width="1.5" />
      <rect x="372" y="50" width="66" height="16" rx="4" fill="var(--color-primary, #0284c7)" />
      <text x="405" y="61" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NGUỒN LÂY</text>
      <text x="372" y="78" font-size="12" font-weight="800" fill="var(--color-primary, #0284c7)">
        Người Bệnh Có Virus Huyết
      </text>
      <text x="372" y="94" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Tải lượng DENV cao trong máu từ 1-2
      </text>
      <text x="372" y="107" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        ngày trước sốt đến ngày 4-5
      </text>
    </g>
    <g class="node-group" id="node-eip">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="620" y="150" width="270" height="80" rx="10" fill="var(--color-purple-hl, rgba(168, 85, 247, 0.08))" stroke="var(--color-purple, #a855f7)" stroke-width="1.5" />
      <rect x="632" y="160" width="144" height="16" rx="4" fill="var(--color-purple, #a855f7)" />
      <text x="704" y="171" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Ủ BỆNH NGOẠI LAI (EIP)</text>
      <text x="632" y="188" font-size="12" font-weight="800" fill="var(--color-purple, #9333ea)">
        Nhân Lên Trong Muỗi Aedes
      </text>
      <text x="632" y="204" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        8–12 ngày (ở 28-30°C). Virus lan từ
      </text>
      <text x="632" y="217" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        ruột giữa lên tuyến nước bọt; muỗi
      </text>
      <text x="632" y="230" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        truyền suốt đời
      </text>
    </g>
    <g class="node-group" id="node-bite">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="620" y="275" width="270" height="75" rx="10" fill="var(--color-teal-hl, rgba(20, 184, 166, 0.08))" stroke="var(--color-teal, #14b8a6)" stroke-width="1.5" />
      <rect x="632" y="285" width="72" height="16" rx="4" fill="var(--color-teal, #14b8a6)" />
      <text x="668" y="296" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">LÂY TRUYỀN</text>
      <text x="632" y="313" font-size="12" font-weight="800" fill="var(--color-teal, #0d9488)">
        Muỗi Cái Đốt Người Lành
      </text>
      <text x="632" y="329" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Tiết nước bọt chứa DENV vào mao mạch;
      </text>
      <text x="632" y="342" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        tập tính đốt ban ngày (sáng sớm / chiều
      </text>
      <text x="632" y="355" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        tối)
      </text>
    </g>
    <g class="node-group" id="node-iip">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="360" y="395" width="240" height="80" rx="10" fill="var(--color-warning-hl, rgba(245, 158, 11, 0.08))" stroke="var(--color-warning, #f59e0b)" stroke-width="1.5" />
      <rect x="372" y="405" width="132" height="16" rx="4" fill="var(--color-warning, #f59e0b)" />
      <text x="438" y="416" font-size="8.5" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">Ủ BỆNH NỘI LAI (IIP)</text>
      <text x="372" y="433" font-size="12" font-weight="800" fill="var(--color-warning, #d97706)">
        Nhân Lên Trong Cơ Thể Người
      </text>
      <text x="372" y="449" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        4–10 ngày (trung bình 4-7 ngày).
      </text>
      <text x="372" y="462" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        DENV nhân lên tại tế bào đuôi gai &amp;
      </text>
      <text x="372" y="475" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        đại thực bào
      </text>
    </g>
    <g class="node-group" id="node-primary">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="70" y="515" width="250" height="85" rx="10" fill="var(--color-success-hl, rgba(16, 185, 129, 0.08))" stroke="var(--color-success, #10b981)" stroke-width="1.5" />
      <rect x="82" y="525" width="150" height="16" rx="4" fill="var(--color-success, #10b981)" />
      <text x="157" y="536" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NHIỄM LẦN ĐẦU (PRIMARY)</text>
      <text x="82" y="553" font-size="12" font-weight="800" fill="var(--color-success, #059669)">
        Sốt Dengue Cổ Điển
      </text>
      <text x="82" y="569" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Tự giới hạn sau 7 ngày; tạo miễn
      </text>
      <text x="82" y="582" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        dịch trung hòa suốt đời với cùng
      </text>
      <text x="82" y="595" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        serotype
      </text>
    </g>
    <g class="node-group" id="node-ade">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="640" y="515" width="250" height="85" rx="10" fill="var(--color-danger-hl, rgba(239, 68, 68, 0.08))" stroke="var(--color-danger, #ef4444)" stroke-width="2" />
      <rect x="652" y="525" width="168" height="16" rx="4" fill="var(--color-danger, #ef4444)" />
      <text x="736" y="536" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NHIỄM THỨ PHÁT (SECONDARY)</text>
      <text x="652" y="553" font-size="12" font-weight="800" fill="var(--color-danger, #dc2626)">
        Cơ Chế ADE &amp; Sốc Dengue (DSS)
      </text>
      <text x="652" y="569" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Khác serotype: phức hợp kháng thể
      </text>
      <text x="652" y="582" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        non-neutralizing gây bão Cytokine,
      </text>
      <text x="652" y="595" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        thoát huyết tương
      </text>
    </g>
  </g>
</svg>
