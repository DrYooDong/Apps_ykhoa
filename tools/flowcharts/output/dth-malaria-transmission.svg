<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" class="editorial-flowchart-svg" style="max-width: 960px; display: block; margin: 1.5rem auto; font-family: var(--font-sans, 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif); background: var(--color-surface, #ffffff); border: 1px solid var(--color-border, #e2e8f0); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); overflow: hidden;">
  <defs>
    <!-- Markers cho các loại mũi tên -->
    <marker id="arr-default" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-border, #94a3b8)" />
    </marker>
    <marker id="arr-primary" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-primary, #0284c7)" />
    </marker>
    <marker id="arr-danger" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-danger, #ef4444)" />
    </marker>
    <marker id="arr-success" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-success, #10b981)" />
    </marker>
    <marker id="arr-warning" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-warning, #f59e0b)" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-teal, #14b8a6)" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-purple, #a855f7)" />
    </marker>
  </defs>

  <style>
    .flowchart-node-rect { transition: all 0.2s ease; cursor: default; }
    .flowchart-node-rect:hover { filter: brightness(0.96); }
    [data-theme="dark"] .editorial-flowchart-svg {
      background: var(--color-surface, #0f172a) !important;
      border-color: var(--color-border, #1e293b) !important;
    }
    [data-theme="dark"] .flowchart-node-rect:hover { filter: brightness(1.1); }
  </style>

  <!-- Header Bar -->
  <g class="flowchart-header">
    <rect x="0" y="0" width="960" height="28" fill="var(--color-surface-2, #f8fafc)" border-bottom="1px solid var(--color-border, #e2e8f0)"/>
    <text x="20" y="18" font-size="11" font-weight="800" fill="var(--color-primary, #0284c7)" letter-spacing="0.5">CHU KỲ LÂY TRUYỀN &amp; ĐỘNG THÁI VÒNG ĐỜI KÝ SINH TRÙNG SỐT RÉT</text>
  </g>

  <!-- Edges Layer -->
  <g class="flowchart-edges">
    <path d="M 620 75 L 754 75 Q 760 75 760 81 L 760 150" fill="none" stroke="var(--color-primary, #0284c7)" stroke-width="1.75" marker-end="url(#arr-primary)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="612" y="65" width="156" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-primary, #0284c7)" stroke-width="1" />
      <text x="690" y="78" font-size="9" font-weight="800" fill="var(--color-primary, #0284c7)" text-anchor="middle" letter-spacing="0.3">ĐẾN GAN TRONG 30-60P</text>
    </g>
    <path d="M 760 235 L 760 285" fill="none" stroke="var(--color-danger, #ef4444)" stroke-width="1.75" marker-end="url(#arr-danger)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="626" y="250" width="268" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-danger, #ef4444)" stroke-width="1" />
      <text x="760" y="263" font-size="9" font-weight="800" fill="var(--color-danger, #ef4444)" text-anchor="middle" letter-spacing="0.3">GIẢI PHÓNG HÀNG CHỤC NGÀN MEROZOITES</text>
    </g>
    <path d="M 620 192.5 L 310 192.5" fill="none" stroke="var(--color-success, #10b981)" stroke-width="1.75" marker-end="url(#arr-success)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="338" y="182.5" width="254" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-success, #10b981)" stroke-width="1" />
      <text x="465" y="195.5" font-size="9" font-weight="800" fill="var(--color-success, #10b981)" text-anchor="middle" letter-spacing="0.3">P. VIVAX / P. OVALE ĐI VÀO THỂ NGỦ</text>
    </g>
    <path d="M 180 235 L 180 330 L 620 330" fill="none" stroke="var(--color-danger, #ef4444)" stroke-width="1.75" marker-end="url(#arr-danger)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="70.5" y="320" width="219" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-danger, #ef4444)" stroke-width="1" />
      <text x="180" y="333" font-size="9" font-weight="800" fill="var(--color-danger, #ef4444)" text-anchor="middle" letter-spacing="0.3">TÁI HOẠT ĐỘNG SAU NHIỀU THÁNG</text>
    </g>
    <path d="M 760 375 L 760 460 L 620 460" fill="none" stroke="var(--color-primary, #0284c7)" stroke-width="1.75" marker-end="url(#arr-primary)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="692.5" y="450" width="135" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-primary, #0284c7)" stroke-width="1" />
      <text x="760" y="463" font-size="9" font-weight="800" fill="var(--color-primary, #0284c7)" text-anchor="middle" letter-spacing="0.3">BIỆT HÓA HỮU TÍNH</text>
    </g>
    <path d="M 340 460 L 340 375 L 180 375" fill="none" stroke="var(--color-primary, #0284c7)" stroke-width="1.75" marker-end="url(#arr-primary)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="272.5" y="365" width="135" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-primary, #0284c7)" stroke-width="1" />
      <text x="340" y="378" font-size="9" font-weight="800" fill="var(--color-primary, #0284c7)" text-anchor="middle" letter-spacing="0.3">MUỖI HÚT GIAO BÀO</text>
    </g>
    <path d="M 180 285 L 180 75 L 340 75" fill="none" stroke="var(--color-primary, #0284c7)" stroke-width="1.75" marker-end="url(#arr-primary)" stroke-linecap="round" stroke-linejoin="round" />
    <g class="edge-label-group">
      <rect x="67" y="65" width="226" height="20" rx="4" fill="var(--color-surface, #ffffff)" stroke="var(--color-primary, #0284c7)" stroke-width="1" />
      <text x="180" y="78" font-size="9" font-weight="800" fill="var(--color-primary, #0284c7)" text-anchor="middle" letter-spacing="0.3">SPOROZOTIES LÊN TUYẾN NƯỚC BỌT</text>
    </g>
  </g>

  <!-- Nodes Layer -->
  <g class="flowchart-nodes">
    <g class="node-group" id="node-inoculation">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="340" y="40" width="280" height="70" rx="10" fill="var(--color-primary-hl, rgba(2, 132, 199, 0.08))" stroke="var(--color-primary, #0284c7)" stroke-width="1.5" />
      <rect x="352" y="50" width="72" height="16" rx="4" fill="var(--color-primary, #0284c7)" />
      <text x="388" y="61" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">LÂY TRUYỀN</text>
      <text x="352" y="78" font-size="12" font-weight="800" fill="var(--color-primary, #0284c7)">
        Muỗi Anopheles Truyền Thoa Trùng
      </text>
      <text x="352" y="94" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Muỗi cái hút máu tiết Sporozoites vào mao
      </text>
      <text x="352" y="107" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        mạch; xâm nhập tế bào gan sau 30–60 phút
      </text>
    </g>
    <g class="node-group" id="node-hepatic">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="620" y="150" width="280" height="85" rx="10" fill="var(--color-purple-hl, rgba(168, 85, 247, 0.08))" stroke="var(--color-purple, #a855f7)" stroke-width="1.5" />
      <rect x="632" y="160" width="120" height="16" rx="4" fill="var(--color-purple, #a855f7)" />
      <text x="692" y="171" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SCHIZOGONY TẠI GAN</text>
      <text x="632" y="188" font-size="12" font-weight="800" fill="var(--color-purple, #9333ea)">
        Giai Đoạn Tiền Hồng Cầu (Gan)
      </text>
      <text x="632" y="204" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Kéo dài 6-16 ngày. Nhân lên thành hàng
      </text>
      <text x="632" y="217" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        chục ngàn Merozoites. P. vivax/ovale tạo
      </text>
      <text x="632" y="230" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Thể Ngủ (Hypnozoites)
      </text>
    </g>
    <g class="node-group" id="node-erythrocytic">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="620" y="285" width="280" height="90" rx="10" fill="var(--color-danger-hl, rgba(239, 68, 68, 0.08))" stroke="var(--color-danger, #ef4444)" stroke-width="2" />
      <rect x="632" y="295" width="126" height="16" rx="4" fill="var(--color-danger, #ef4444)" />
      <text x="695" y="306" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SCHIZOGONY HỒNG CẦU</text>
      <text x="632" y="323" font-size="12" font-weight="800" fill="var(--color-danger, #dc2626)">
        Chu Kỳ Cơn Sốt Rét Lâm Sàng
      </text>
      <text x="632" y="339" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Merozoites xâm nhập phá vỡ hồng cầu chu
      </text>
      <text x="632" y="352" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        kỳ 48h (falciparum/vivax) hoặc 72h
      </text>
      <text x="632" y="365" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        (malariae): Rét run - Sốt cao - Vã mồ hôi
      </text>
    </g>
    <g class="node-group" id="node-gametocyte">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="340" y="420" width="280" height="80" rx="10" fill="var(--color-warning-hl, rgba(245, 158, 11, 0.08))" stroke="var(--color-warning, #f59e0b)" stroke-width="1.5" />
      <rect x="352" y="430" width="114" height="16" rx="4" fill="var(--color-warning, #f59e0b)" />
      <text x="409" y="441" font-size="8.5" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">BIỆT HÓA GIAO BÀO</text>
      <text x="352" y="458" font-size="12" font-weight="800" fill="var(--color-warning, #d97706)">
        HÌnh Thành Giao Bào (Gametocytes)
      </text>
      <text x="352" y="474" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Một phần Merozoites biệt hóa thành giao
      </text>
      <text x="352" y="487" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        bào đực và cái lưu hành trong máu (không
      </text>
      <text x="352" y="500" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        gây triệu chứng lâm sàng)
      </text>
    </g>
    <g class="node-group" id="node-sporogony">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="50" y="285" width="260" height="90" rx="10" fill="var(--color-teal-hl, rgba(20, 184, 166, 0.08))" stroke="var(--color-teal, #14b8a6)" stroke-width="1.5" />
      <rect x="62" y="295" width="132" height="16" rx="4" fill="var(--color-teal, #14b8a6)" />
      <text x="128" y="306" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SPOROGONY TRONG MUỖI</text>
      <text x="62" y="323" font-size="12" font-weight="800" fill="var(--color-teal, #0d9488)">
        Sinh Sản Hữu Tính Trong Anopheles
      </text>
      <text x="62" y="339" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Muỗi hút giao bào: Thụ tinh tại dạ dày
      </text>
      <text x="62" y="352" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        muỗi -&gt; Ookinete -&gt; Oocyst -&gt; Phóng
      </text>
      <text x="62" y="365" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        thích Sporozoites lên tuyến nước bọt
      </text>
      <text x="62" y="378" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        (8-30 ngày)
      </text>
    </g>
    <g class="node-group" id="node-hypnozoite">
      <!-- Node Background Card -->
      <rect class="flowchart-node-rect" x="50" y="150" width="260" height="85" rx="10" fill="var(--color-success-hl, rgba(16, 185, 129, 0.08))" stroke="var(--color-success, #10b981)" stroke-width="1.5" />
      <rect x="62" y="160" width="132" height="16" rx="4" fill="var(--color-success, #10b981)" />
      <text x="128" y="171" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">THỂ NGỦ (HYPNOZOITE)</text>
      <text x="62" y="188" font-size="12" font-weight="800" fill="var(--color-success, #059669)">
        Tái Phát Xa (Relapse)
      </text>
      <text x="62" y="204" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        Chỉ có ở P. vivax và P. ovale: ngủ yên
      </text>
      <text x="62" y="217" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        trong gan nhiều tháng/năm; chỉ bị diệt
      </text>
      <text x="62" y="230" font-size="9.5" font-weight="500" fill="var(--color-text, #334155)">
        bởi Primaquine / Tafenoquine
      </text>
    </g>
  </g>
</svg>
