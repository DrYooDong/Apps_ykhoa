<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="100%" height="100%">
  <defs>
    <style>
      .box-tp { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .box-fp { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .box-fn { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
      .box-tn { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .matrix-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 16px; fill: var(--color-text, #0f172a); }
      .matrix-sub { font-family: 'Inter', sans-serif; font-size: 13px; fill: var(--color-text-muted, #475569); }
      .cell-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 15px; }
      .cell-desc { font-family: 'Inter', sans-serif; font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect width="750" height="420" rx="16" fill="var(--color-surface, #ffffff)" stroke="var(--color-divider, #cbd5e1)" stroke-width="1.5"/>

  <!-- Top Headers -->
  <text x="375" y="35" class="matrix-title" text-anchor="middle">BẢNG CHẨN ĐOÁN 2x2 (DIAGNOSTIC 2x2 MATRIX)</text>
  
  <text x="330" y="80" class="matrix-title" fill="#1e293b" text-anchor="middle">MẮC BỆNH (+)</text>
  <text x="560" y="80" class="matrix-title" fill="#1e293b" text-anchor="middle">KHÔNG BỆNH (-)</text>

  <!-- Left Headers -->
  <text x="130" y="160" class="matrix-title" fill="#1e293b" text-anchor="end">XÉT NGHIỆM (+)</text>
  <text x="130" y="270" class="matrix-title" fill="#1e293b" text-anchor="end">XÉT NGHIỆM (-)</text>

  <!-- Cell A: True Positive -->
  <rect x="220" y="100" width="220" height="100" rx="12" class="box-tp" />
  <text x="330" y="135" class="cell-title" fill="#16a34a" text-anchor="middle">Dương Tính Thật (TP - a)</text>
  <text x="330" y="165" class="cell-desc" text-anchor="middle">Độ nhạy Sensitivity = a / (a + c)</text>

  <!-- Cell B: False Positive -->
  <rect x="450" y="100" width="220" height="100" rx="12" class="box-fp" />
  <text x="560" y="135" class="cell-title" fill="#dc2626" text-anchor="middle">Dương Tính Giả (FP - b)</text>
  <text x="560" y="165" class="cell-desc" text-anchor="middle">Gây chẩn đoán nhầm (Báo động giả)</text>

  <!-- Cell C: False Negative -->
  <rect x="220" y="210" width="220" height="100" rx="12" class="box-fn" />
  <text x="330" y="245" class="cell-title" fill="#d97706" text-anchor="middle">Âm Tính Giả (FN - c)</text>
  <text x="330" y="275" class="cell-desc" text-anchor="middle">Bỏ sót bệnh (Bỏ qua can thiệp)</text>

  <!-- Cell D: True Negative -->
  <rect x="450" y="210" width="220" height="100" rx="12" class="box-tn" />
  <text x="560" y="245" class="cell-title" fill="#2563eb" text-anchor="middle">Âm Tính Thật (TN - d)</text>
  <text x="560" y="275" class="cell-desc" text-anchor="middle">Độ đặc hiệu Specificity = d / (b + d)</text>

  <!-- Bottom Formulas Summary -->
  <rect x="50" y="325" width="650" height="70" rx="12" fill="var(--color-surface-2, #f8fafc)" stroke="var(--color-divider, #e2e8f0)"/>
  <text x="70" y="352" font-family="'JetBrains Mono', monospace" font-size="12" fill="#0284c7">PPV (Giá trị dự đoán +) = a / (a + b)</text>
  <text x="70" y="375" font-family="'JetBrains Mono', monospace" font-size="12" fill="#0284c7">NPV (Giá trị dự đoán -) = d / (c + d)</text>

  <text x="400" y="352" font-family="'JetBrains Mono', monospace" font-size="12" fill="#059669">LR+ = Sens / (1 - Spec)</text>
  <text x="400" y="375" font-family="'JetBrains Mono', monospace" font-size="12" fill="#059669">LR- = (1 - Sens) / Spec</text>
</svg>
