<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" class="cliniportal-svg-nomogram">
  <defs>
    <style>
      .bg-grid { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .axis-line { stroke: #475569; stroke-width: 2; }
      .grid-line { stroke: #cbd5e1; stroke-width: 0.5; stroke-dasharray: 4 4; }
      .zone-normal { fill: rgba(34, 197, 94, 0.15); stroke: #22c55e; stroke-width: 1.5; }
      .zone-met-acid { fill: rgba(239, 68, 68, 0.12); stroke: #ef4444; stroke-width: 1; }
      .zone-resp-acid { fill: rgba(245, 158, 11, 0.12); stroke: #f59e0b; stroke-width: 1; }
      .zone-met-alk { fill: rgba(59, 130, 246, 0.12); stroke: #3b82f6; stroke-width: 1; }
      .zone-resp-alk { fill: rgba(168, 85, 247, 0.12); stroke: #a855f7; stroke-width: 1; }
      .isobar { fill: none; stroke: #94a3b8; stroke-width: 1.2; }
      .text-label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; fill: #334155; font-weight: 600; }
      .text-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; fill: #0f172a; font-weight: 700; }
      .patient-point { fill: #dc2626; stroke: #ffffff; stroke-width: 3; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3)); }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect x="50" y="30" width="520" height="320" class="bg-grid" rx="8" />

  <!-- Grid Lines -->
  <line x1="50" y1="110" x2="570" y2="110" class="grid-line"/>
  <line x1="50" y1="190" x2="570" y2="190" class="grid-line"/>
  <line x1="50" y1="270" x2="570" y2="270" class="grid-line"/>
  <line x1="180" y1="30" x2="180" y2="350" class="grid-line"/>
  <line x1="310" y1="30" x2="310" y2="350" class="grid-line"/>
  <line x1="440" y1="30" x2="440" y2="350" class="grid-line"/>

  <!-- Diagnostic Zones (Polygons) -->
  <!-- Zone 1: Normal Range (pH 7.35-7.45, pCO2 35-45) -->
  <rect x="284" y="162" x2="336" y2="218" width="52" height="56" class="zone-normal" rx="4" />
  <text x="310" y="193" text-anchor="middle" class="text-label" fill="#166534">BÌNH THƯỜNG</text>

  <!-- Zone 2: Toan chuyển hóa (Metabolic Acidosis) -->
  <polygon points="120,290 284,218 284,270 120,330" class="zone-met-acid" />
  <text x="190" y="275" text-anchor="middle" class="text-label" fill="#991b1b">Toan Chuyển Hóa</text>

  <!-- Zone 3: Toan hô hấp (Respiratory Acidosis) -->
  <polygon points="120,70 284,162 250,218 90,110" class="zone-resp-acid" />
  <text x="170" y="130" text-anchor="middle" class="text-label" fill="#92400e">Toan Hô Hấp</text>

  <!-- Zone 4: Kiềm chuyển hóa (Metabolic Alkalosis) -->
  <polygon points="336,162 520,70 520,130 336,218" class="zone-met-alk" />
  <text x="440" y="140" text-anchor="middle" class="text-label" fill="#1e40af">Kiềm Chuyển Hóa</text>

  <!-- Zone 5: Kiềm hô hấp (Respiratory Alkalosis) -->
  <polygon points="336,218 520,290 520,330 336,270" class="zone-resp-alk" />
  <text x="430" y="270" text-anchor="middle" class="text-label" fill="#6b21a8">Kiềm Hô Hấp</text>

  <!-- Main Axes -->
  <line x1="50" y1="350" x2="570" y2="350" class="axis-line" />
  <line x1="50" y1="30" x2="50" y2="350" class="axis-line" />

  <!-- Axis Labels -->
  <text x="310" y="385" text-anchor="middle" class="text-title">pH Máu Động Mạch</text>
  <text x="20" y="190" text-anchor="middle" class="text-title" transform="rotate(-90 20,190)">pCO₂ (mmHg)</text>

  <!-- Axis Ticks -->
  <text x="50" y="368" text-anchor="middle" class="text-label">6.8</text>
  <text x="180" y="368" text-anchor="middle" class="text-label">7.0</text>
  <text x="310" y="368" text-anchor="middle" class="text-label">7.4</text>
  <text x="440" y="368" text-anchor="middle" class="text-label">7.6</text>
  <text x="570" y="368" text-anchor="middle" class="text-label">7.8</text>

  <text x="40" y="354" text-anchor="end" class="text-label">10</text>
  <text x="40" y="274" text-anchor="end" class="text-label">35</text>
  <text x="40" y="194" text-anchor="end" class="text-label">60</text>
  <text x="40" y="114" text-anchor="end" class="text-label">85</text>
  <text x="40" y="34" text-anchor="end" class="text-label">110</text>

  <!-- Live Dynamic Patient Point (JS targets ID patient-dot-svg) -->
  <circle id="patient-dot-svg" cx="310" cy="190" r="7" class="patient-point" />
</svg>
