<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pyrGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pyrGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="pyrGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="pyrGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="pyrGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pyr-level { transition: transform 0.25s ease, filter 0.25s ease; cursor: pointer; }
    .pyr-level:hover { transform: translateY(-4px); filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25)); }
    .pyr-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; fill: #ffffff; font-size: 16px; text-anchor: middle; }
    .pyr-subtext { font-family: 'Inter', sans-serif; font-size: 12px; fill: rgba(255,255,255,0.85); text-anchor: middle; }
    .pyr-label-side { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 14px; fill: var(--color-text, #0f172a); }
  </style>

  <!-- Background container -->
  <rect width="800" height="500" rx="16" fill="var(--color-surface-2, #f8fafc)" stroke="var(--color-divider, #e2e8f0)" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="400" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="var(--color-text, #0f172a)" text-anchor="middle">THÁP BẰNG CHỨNG Y HỌC (EVIDENCE PYRAMID)</text>
  <text x="400" y="70" font-family="'Inter', sans-serif" font-size="13" fill="var(--color-text-muted, #64748b)" text-anchor="middle">Phân cấp giá trị chứng cứ từ Tổng quan hệ thống đến Khuyến cáo chuyên gia</text>

  <!-- Level 1: Meta-Analysis & Guidelines (Top) -->
  <g class="pyr-level">
    <polygon points="400,95 310,165 490,165" fill="url(#pyrGrad1)" />
    <text x="400" y="135" class="pyr-text">Cấp I: Meta-Analysis / SR</text>
    <text x="400" y="152" class="pyr-subtext">Tổng quan hệ thống & Guidelines</text>
  </g>

  <!-- Level 2: RCT -->
  <g class="pyr-level">
    <polygon points="305,170 230,240 570,240 495,170" fill="url(#pyrGrad2)" />
    <text x="400" y="200" class="pyr-text">Cấp II: Thử nghiệm Lâm sàng Ngẫu nhiên (RCT)</text>
    <text x="400" y="220" class="pyr-subtext">Mù đôi, Có nhóm chứng kiểm soát</text>
  </g>

  <!-- Level 3: Cohort Studies -->
  <g class="pyr-level">
    <polygon points="225,245 150,315 650,315 575,245" fill="url(#pyrGrad3)" />
    <text x="400" y="275" class="pyr-text">Cấp III: Nghiên cứu Thuần tập (Cohort Study)</text>
    <text x="400" y="295" class="pyr-subtext">Tiến cứu & Hồi cứu có nhóm so sánh</text>
  </g>

  <!-- Level 4: Case-Control & Case Series -->
  <g class="pyr-level">
    <polygon points="145,320 70,390 730,390 655,320" fill="url(#pyrGrad4)" />
    <text x="400" y="350" class="pyr-text">Cấp IV: Bệnh-Chứng (Case-Control) & Báo cáo Loạt Ca</text>
    <text x="400" y="370" class="pyr-subtext">Nghiên cứu quan sát mô tả</text>
  </g>

  <!-- Level 5: Expert Opinion & Lab -->
  <g class="pyr-level">
    <polygon points="65,395 10,465 790,465 735,395" fill="url(#pyrGrad5)" />
    <text x="400" y="425" class="pyr-text">Cấp V: Ý kiến Chuyên gia & In-Vitro Lab</text>
    <text x="400" y="445" class="pyr-subtext">Cơ chế sinh học & Kinh nghiệm lâm sàng</text>
  </g>

  <!-- Arrow Indicator on Right Side -->
  <line x1="765" y1="465" x2="765" y2="100" stroke="#0284c7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="755" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0284c7" text-anchor="middle" transform="rotate(-90 755 280)">ĐỘ NGHỆ NGHỆCH & SỨC MẠNH CHỨNG CỨ TĂNG DẦN ↑</text>
</svg>
