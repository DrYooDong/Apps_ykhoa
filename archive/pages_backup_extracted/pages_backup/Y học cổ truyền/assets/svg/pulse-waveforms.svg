<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="800" height="400" fill="#0f172a" rx="12"/>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
  </g>

  <!-- Mạch Phù Wave (Top Left) -->
  <g transform="translate(20, 20)">
    <text x="0" y="20" fill="#38bdf8" font-size="14" font-weight="bold">1. Mạch Phù (Nông, cao biên độ nhẹ)</text>
    <path d="M 0 60 Q 30 10, 60 60 T 120 60 T 180 60 T 240 60 T 300 60" fill="none" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Mạch Trầm Wave (Top Right) -->
  <g transform="translate(420, 20)">
    <text x="0" y="20" fill="#34d399" font-size="14" font-weight="bold">2. Mạch Trầm (Sâu, biên độ nhỏ dưới đáy)</text>
    <path d="M 0 80 Q 30 60, 60 80 T 120 80 T 180 80 T 240 80 T 300 80" fill="none" stroke="#34d399" stroke-width="3"/>
  </g>

  <!-- Mạch Hoạt Wave (Bottom Left) -->
  <g transform="translate(20, 220)">
    <text x="0" y="20" fill="#facc15" font-size="14" font-weight="bold">3. Mạch Hoạt (Trơn trượt tròn nhẵn)</text>
    <path d="M 0 60 C 20 10, 40 10, 60 60 C 80 10, 100 10, 120 60 C 140 10, 160 10, 180 60" fill="none" stroke="#facc15" stroke-width="3.5"/>
  </g>

  <!-- Mạch Sáp Wave (Bottom Right) -->
  <g transform="translate(420, 220)">
    <text x="0" y="20" fill="#f87171" font-size="14" font-weight="bold">4. Mạch Sáp (Trì trệ ngập ngừng)</text>
    <path d="M 0 60 L 15 50 L 30 65 L 45 45 L 60 60 L 75 55 L 90 60 L 105 50 L 120 60" fill="none" stroke="#f87171" stroke-width="2.5"/>
  </g>
</svg>
