  <!-- Offline file:/// Fallback Loader -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If module is blocked under file:/// protocol, dynamically load IIFE bundle
      setTimeout(() => {
        const rootEl = document.getElementById('root');
        if (rootEl && rootEl.children.length === 0) {
          console.info('Module blocked or pending, activating standalone IIFE bundle...');
          const s = document.createElement('script');
          s.src = './assets/abg-app.iife.js?v=' + Date.now();
          document.body.appendChild(s);
        }
      }, 300);
    });
  </script>
