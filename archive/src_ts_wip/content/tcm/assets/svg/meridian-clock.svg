<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <circle cx="250" cy="250" r="220" fill="#f8fafc" stroke="#0284c7" stroke-width="4"/>
  <circle cx="250" cy="250" r="160" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Meridian Clock Dial Segments (12 Hours) -->
  <g font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    <!-- 03-05 Phế -->
    <text x="250" y="70" fill="#0284c7">03:00 - 05:00 Dần (Phế)</text>
    <!-- 05-07 Đại Trường -->
    <text x="340" y="95" fill="#0284c7">05:00 - 07:00 Mão (Đại Trường)</text>
    <!-- 07-09 Vị -->
    <text x="400" y="160" fill="#0284c7">07:00 - 09:00 Thìn (Vị)</text>
    <!-- 09-11 Tỳ -->
    <text x="415" y="255" fill="#0284c7">09:00 - 11:00 Tỵ (Tỳ)</text>
    <!-- 11-13 Tâm -->
    <text x="390" y="340" fill="#0284c7">11:00 - 13:00 Ngọ (Tâm)</text>
    <!-- 13-15 Tiểu Trường -->
    <text x="320" y="410" fill="#0284c7">13:00 - 15:00 Mùi (Tiểu Trường)</text>
    <!-- 15-17 Bàng Quang -->
    <text x="250" y="440" fill="#0284c7">15:00 - 17:00 Thân (Bàng Quang)</text>
    <!-- 17-19 Thận -->
    <text x="170" y="410" fill="#0284c7">17:00 - 19:00 Dậu (Thận)</text>
    <!-- 19-21 Tâm Bào -->
    <text x="100" y="340" fill="#0284c7">19:00 - 21:00 Tuất (Tâm Bào)</text>
    <!-- 21-23 Tam Tiêu -->
    <text x="85" y="255" fill="#0284c7">21:00 - 23:00 Hợi (Tam Tiêu)</text>
    <!-- 23-01 Đảm -->
    <text x="100" y="160" fill="#0284c7">23:00 - 01:00 Tý (Đảm)</text>
    <!-- 01-03 Can -->
    <text x="160" y="95" fill="#0284c7">01:00 - 03:00 Sửu (Can)</text>
  </g>

  <!-- Center Title -->
  <text x="250" y="240" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">TÝ NGỌ LƯU CHU</text>
  <text x="250" y="265" font-size="13" fill="#64748b" text-anchor="middle">Đồng hồ Kinh Khí 12 Giờ YHCT</text>
</svg>
