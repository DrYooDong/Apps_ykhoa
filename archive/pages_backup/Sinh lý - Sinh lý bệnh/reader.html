<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trình Đọc Bài Học Sinh Lý & Sinh Lý Bệnh - CliniPortal">
    <title>Bài Học Sinh Lý – CliniPortal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- CSS Cấp 3 -->
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components/header.css">
    <link rel="stylesheet" href="../../css/components/sidebar.css">
    <link rel="stylesheet" href="../../css/components/footer.css">
    <link rel="stylesheet" href="../../css/components/toc.css">
    <link rel="stylesheet" href="css/physio-shared.css">

    <!-- MathJax for TeX equations -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>

    <!-- Scripts hệ thống -->
    <script src="../../components/header.js" defer></script>
    <script src="../../components/footer.js" defer></script>
    <script src="../../js/main.js" defer></script>
    <script src="../../js/toc.js" defer></script>
    <script src="js/physio-shared.js" defer></script>

    <!-- Engines phi HTML -->
    <script src="js/physio-md-engine.js"></script>
    <script src="js/physio-pathway-viewer.js"></script>
</head>

<body>
    <div id="header-placeholder" data-header-path="../../components/header.html"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="app-sidebar" id="appSidebar">
            <button id="sidebar-toggle-arrow" class="sidebar-toggle-arrow" aria-label="Thu gọn/Mở rộng Sidebar">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="toggle-arrow-svg">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <nav class="sidebar-nav" aria-label="Điều hướng chính">
                <ul class="nav-list" role="list">
                    <li>
                        <a href="../../index.html" class="nav-item" title="Trang chủ">
                            <span class="nav-icon">🏠</span>
                            <span class="nav-text">Trang chủ</span>
                        </a>
                    </li>
                    <li>
                        <a href="Sinhly-sinhlybenh.html" class="nav-item active" title="Sinh lý & Sinh lý bệnh">
                            <span class="nav-icon">🧬</span>
                            <span class="nav-text">Sinh lý & Sinh lý bệnh</span>
                        </a>
                    </li>
                    <li>
                        <a href="formula-vault.html" class="nav-item" title="Kho Công Thức">
                            <span class="nav-icon">📐</span>
                            <span class="nav-text">Kho Công Thức Sinh Lý</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- MAIN CONTENT WRAPPER -->
        <div class="main-wrapper" id="mainContent">
            <!-- BREADCRUMB -->
            <clini-breadcrumb items='[{"label": "🏠 Home", "url": "../../index.html"}, {"label": "Sinh lý & sinh lý bệnh", "url": "Sinhly-sinhlybenh.html"}, {"label": "Bài đọc Markdown"}]'></clini-breadcrumb>

            <main class="visual-container" style="padding: 2rem;">
                <div id="article-header" class="chapter-header">
                    <h1 id="article-title">Đang tải bài viết...</h1>
                    <p id="article-subtitle">Hệ thống đang xử lý dữ liệu Markdown nguồn...</p>
                    <div id="article-meta" style="margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap;"></div>
                </div>

                <!-- Interactive SVG Container (Injected if available) -->
                <div id="interactive-diagram-container" style="margin-bottom: 2rem; display: none;">
                    <div style="background: var(--color-surface); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--color-border);">
                        <h3 style="color: var(--color-primary); margin-top: 0;">📊 Sơ đồ Vector Tương tác (SVG Interactive Diagram)</h3>
                        <div id="svg-host" style="max-width: 800px; margin: 0 auto;"></div>
                    </div>
                </div>

                <!-- Interactive Pathway Container (Injected if available) -->
                <div id="interactive-pathway-container" style="margin-bottom: 2rem; display: none;"></div>

                <!-- MAIN ARTICLE BODY (toc.js will scan this container) -->
                <article class="physio-article" id="article-body">
                    <div style="text-align: center; padding: 3rem; color: var(--color-text-muted);">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p style="margin-top: 1rem;">Đang khởi chạy Markdown Engine...</p>
                    </div>
                </article>
            </main>
        </div>
    </div>

    <div id="footer-placeholder" data-footer-path="../../components/footer.html"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const urlParams = new URLSearchParams(window.location.search);
            let articlePath = urlParams.get('article') || 'content/sinhly/phan1/SL_TB_Diensinhly.md';

            // Load Article via MDEngine
            const result = await PhysioMDEngine.loadArticle(articlePath);
            const meta = result.metadata || {};

            // Render Title & Subtitle
            document.title = `${meta.title || 'Bài Học Sinh Lý'} – CliniPortal`;
            document.getElementById('article-title').innerText = meta.title || 'Bài Học Sinh Lý';
            document.getElementById('article-subtitle').innerText = meta.category || 'Tài liệu Sinh lý học chuyên sâu';

            // Render Metadata badges
            let metaHtml = '';
            if (meta.difficulty) metaHtml += `<span class="quiz-badge">${meta.difficulty}</span>`;
            if (meta.read_time) metaHtml += `<span class="quiz-badge" style="background:rgba(16,185,129,0.1); color:var(--color-success);"><i class="far fa-clock"></i> ${meta.read_time}</span>`;
            if (meta.tags && Array.isArray(meta.tags)) {
                meta.tags.forEach(tag => {
                    metaHtml += `<span style="font-size:0.75rem; background:rgba(2,132,199,0.1); color:var(--color-primary); padding:2px 8px; border-radius:12px;">#${tag}</span>`;
                });
            }
            document.getElementById('article-meta').innerHTML = metaHtml;

            // Render Body
            document.getElementById('article-body').innerHTML = PhysioMDEngine.renderMarkdown(result.body);

            // Render Interactive SVG Diagram if flagged
            if (meta.has_interactive_diagram) {
                const svgContainer = document.getElementById('interactive-diagram-container');
                const svgHost = document.getElementById('svg-host');
                svgContainer.style.display = 'block';
                try {
                    const svgResp = await fetch('diagrams/action-potential.svg');
                    const svgText = await svgResp.text();
                    svgHost.innerHTML = svgText;
                } catch (e) {
                    console.error('Error fetching SVG diagram:', e);
                }
            }

            // Render Interactive Pathway if flagged
            if (meta.has_pathway) {
                const pathwayContainer = document.getElementById('interactive-pathway-container');
                pathwayContainer.style.display = 'block';
                PhysioPathwayViewer.init('interactive-pathway-container', 'acs_pathway');
            }

            // Trigger MathJax typeset
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        });
    </script>
</body>

</html>
