<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <!-- Tongue Silhouette -->
  <path d="M 100 100 C 100 20, 300 20, 300 100 C 300 350, 260 460, 200 480 C 140 460, 100 350, 100 100 Z" fill="#fecdd3" stroke="#e11d48" stroke-width="4"/>

  <!-- Gốc lưỡi (Thận / Bàng Quang / Đại Tràng) -->
  <path d="M 115 100 C 115 40, 285 40, 285 100 L 270 180 L 130 180 Z" fill="#fb7185" opacity="0.4"/>
  <text x="200" y="120" font-size="14" font-weight="bold" fill="#881337" text-anchor="middle">GỐC LƯỠI</text>
  <text x="200" y="140" font-size="12" fill="#9f1239" text-anchor="middle">Thận / Bàng Quang / Đại Tràng</text>

  <!-- Giữa lưỡi (Tỳ / Vị) -->
  <rect x="140" y="190" width="120" height="120" rx="10" fill="#fde047" opacity="0.4"/>
  <text x="200" y="245" font-size="14" font-weight="bold" fill="#713f12" text-anchor="middle">GIỮA LƯỠI</text>
  <text x="200" y="265" font-size="12" fill="#854d0e" text-anchor="middle">Tỳ / Vị (Trung Tiêu)</text>

  <!-- Rìa lưỡi (Can / Đảm) -->
  <path d="M 105 150 C 100 250, 120 350, 140 400 L 140 190 Z" fill="#4ade80" opacity="0.5"/>
  <path d="M 295 150 C 300 250, 280 350, 260 400 L 260 190 Z" fill="#4ade80" opacity="0.5"/>
  <text x="120" y="270" font-size="11" font-weight="bold" fill="#14532d" transform="rotate(-75 120 270)" text-anchor="middle">RÌA: CAN / ĐẢM</text>
  <text x="280" y="270" font-size="11" font-weight="bold" fill="#14532d" transform="rotate(75 280 270)" text-anchor="middle">RÌA: CAN / ĐẢM</text>

  <!-- Đầu lưỡi (Tâm / Phế) -->
  <path d="M 140 380 C 160 440, 200 475, 200 475 C 200 475, 240 440, 260 380 Z" fill="#38bdf8" opacity="0.5"/>
  <text x="200" y="420" font-size="14" font-weight="bold" fill="#0c4a6e" text-anchor="middle">ĐẦU LƯỠI</text>
  <text x="200" y="440" font-size="12" fill="#075985" text-anchor="middle">Tâm / Phế (Thượng Tiêu)</text>
</svg>
