<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CliniPortal - Hệ sinh thái công cụ hỗ trợ lâm sàng dành cho bác sĩ nội khoa">
  <title>CliniPortal – Hệ sinh thái Y khoa & Công cụ Lâm sàng</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- PWA Manifest & App Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CliniPortal">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="assets/icons/app-icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192x192.png">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/sidebar.css">
  <link rel="stylesheet" href="css/components/footer.css">
  <link rel="stylesheet" href="css/components/homepage-widgets.css">
  <link rel="stylesheet" href="css/components/homepage-effects.css">
  <link rel="stylesheet" href="css/components/module-dashboard.css">
  <link rel="stylesheet" href="css/components/toc.css">
  <link rel="stylesheet" href="css/components/pulse.css">

  <script src="js/main.js" defer></script>
  <script src="components/footer.js" defer></script>
</head>

<body>
  <!-- ===================== GLOBAL HEADER ===================== -->
  <header class="global-header">
    <div class="header-left">
      <a href="#/" class="logo-brand" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.5rem;">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect width="28" height="28" rx="7" fill="#0284c7" />
          <path d="M14 6v16M8 11h12M8 17h8" stroke="white" stroke-width="2" stroke-linecap="round" />
        </svg>
        <span class="logo-text" style="font-weight: 700; font-size: 1.25rem;">CliniPortal</span>
      </a>
    </div>

    <div class="search-bar-container">
      <div class="search-container">
        <svg viewBox="0 0 24 24" class="search__icon" aria-hidden="true">
          <g>
            <path
              d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z" />
          </g>
        </svg>
        <input class="input" type="search" placeholder="Tìm công cụ, phác đồ… (Phím /)" aria-label="Tìm kiếm">
      </div>
      <div class="search-results-dropdown" id="searchResultsDropdown"></div>
    </div>

    <div class="header-actions">
      <!-- Command Palette trigger -->
      <button class="header-cmd-hint" id="cmdPaletteTrigger" title="Mở Command Palette (Ctrl+K)"
        aria-label="Command Palette">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Tìm nhanh</span>
        <kbd>Ctrl K</kbd>
      </button>

      <!-- Hotkey Help trigger -->
      <button class="header-cmd-hint" id="hotkeyHelpBtn" title="Bảng phím tắt (?)"
        aria-label="Keyboard Shortcuts">
        <i class="fa-solid fa-keyboard"></i>
        <span>Phím tắt</span>
        <kbd>?</kbd>
      </button>

      <button id="theme-toggle-btn" title="Chuyển đổi Sáng/Tối" aria-label="Toggle Theme">🌓</button>
    </div>
  </header>

  <!-- ===================== APP CONTAINER (SPA DYNAMIC MOUNT) ===================== -->
  <div class="app-container">
    <main class="main-wrapper" id="app">
      <!-- SPA views (HomeView, ArticleView, CategoryView) mounted dynamically by src/index.ts -->
    </main>
  </div>

  <!-- Placeholder nạp footer.html -->
  <div id="footer-placeholder" data-footer-path="components/footer.html"></div>

  <!-- ========== GLOBAL UI OVERLAYS ========== -->
  <!-- Scroll Progress Bar -->
  <div class="scroll-progress-bar" id="scrollProgressBar" aria-hidden="true"></div>

  <!-- Back-to-Top Button -->
  <button class="back-to-top" id="backToTopBtn" title="Về đầu trang" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <!-- Scripts Entry Point -->
  <script type="module" src="./src/index.ts"></script>
</body>

</html>
