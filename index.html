<body>
  <!-- ===================== GLOBAL HEADER ===================== -->
  <header class="global-header">
    <div class="header-left" style="display: flex; align-items: center; gap: 0.75rem;">
      <a href="#/" class="logo-brand" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.5rem;">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect width="28" height="28" rx="7" fill="#0284c7" />
          <path d="M14 6v16M8 11h12M8 17h8" stroke="white" stroke-width="2" stroke-linecap="round" />

        <span class="logo-text" style="font-weight: 700; font-size: 1.25rem;">CliniPortal</span>

      <!-- Nút Quay Lại -->
      <button class="btn-back-nav" id="globalBackBtn" onclick="window.history.back()" style="display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.35rem 0.75rem; font-size: 0.825rem; font-weight: 600; border-radius: 2rem; border: 1px solid var(--color-border, #e2e8f0); background: var(--color-surface, #fff); color: var(--color-text-muted, #64748b); cursor: pointer; transition: all 0.2s;" title="Quay lại trang trước">
        <i class="fa-solid fa-arrow-left"></i> Quay lại
      </button>
    </div>

    <div class="search-bar-container">
      <div class="search-container">
        <svg viewBox="0 0 24 24" class="search__icon" aria-hidden="true">
          <g>
            <path
              d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z" />
          </g>
        </svg>
        <input class="input" type="search" placeholder="Tìm công cụ, phác đồ… (Phím /)" aria-label="Tìm kiếm">
      </div>
      <div class="search-results-dropdown" id="searchResultsDropdown"></div>
    </div>

    <div class="header-actions">
      <!-- Command Palette trigger -->
      <button class="header-cmd-hint" id="cmdPaletteTrigger" title="Mở Command Palette (Ctrl+K)"
        aria-label="Command Palette">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Tìm nhanh</span>
        <kbd>Ctrl K</kbd>
      </button>

      <!-- Hotkey Help trigger -->
      <button class="header-cmd-hint" id="hotkeyHelpBtn" title="Bảng phím tắt (?)"
        aria-label="Keyboard Shortcuts">
        <i class="fa-solid fa-keyboard"></i>
        <span>Phím tắt</span>
        <kbd>?</kbd>
      </button>

      <button id="theme-toggle-btn" title="Chuyển đổi Sáng/Tối" aria-label="Toggle Theme">🌓</button>
    </div>
  </header>

    <aside class="app-sidebar" id="appSidebar">
      <button id="sidebar-toggle-arrow" class="sidebar-toggle-arrow" aria-label="Thu gọn/Mở rộng Sidebar">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none"

          </li>
          <li>
            <a href="#/pathophysiology" class="nav-item" title="S.lý - S.lý bệnh">
              <span class="nav-icon">🧬</span>
              <span class="nav-text">S.lý - S.lý bệnh</span>

          <li>

            </a>
          </li>
          <li>

              <span class="nav-icon">⚙️</span>
              <span class="nav-text">Công cụ</span>
            </a>
          </li>
          <li>
            <a href="#/pharmacology" class="nav-item" title="Dược lý">
              <span class="nav-icon">💊</span>
              <span class="nav-text">Dược lý</span>
            </a>
          </li>
          <li>
            <a href="#/ebm" class="nav-item" title="Y học chứng cứ">
              <span class="nav-icon">📄</span>
              <span class="nav-text">Y học chứng cứ</span>
            </a>
          </li>
          <li>
            <a href="#/tcm" class="nav-item" title="Y học cổ truyền">
              <span class="nav-icon">☯️</span>
              <span class="nav-text">Y học cổ truyền</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main-wrapper" id="app" style="flex: 1; min-width: 0; padding: 0;">
      <!-- SPA views (HomeView, ArticleView, CategoryView) mounted dynamically by src/index.ts -->
    </main>

  <!-- ========== GLOBAL UI OVERLAYS ========== -->

  <div class="scroll-progress-bar" id="scrollProgressBar" aria-hidden="true"></div>

  <!-- Back-to-Top Button -->
  <button class="back-to-top" id="backToTopBtn" title="Về đầu trang" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <!-- Scripts Entry Point -->
</body>

</html>
