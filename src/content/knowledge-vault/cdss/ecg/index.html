      <button id="theme-toggle" class="cdss-portal-theme-btn" title="Chuyển chế độ Sáng/Tối" aria-label="Toggle Theme">

      </button>
    </div>
  </header>

  <!-- Mount Point for Full React Application -->
  <div id="root"></div>

  <!-- Offline file:/// Fallback Loader -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Theme toggle support
      const themeBtn = document.getElementById('theme-toggle');
      if (themeBtn) {
        const savedTheme = localStorage.getItem('cliniportal_theme') || 
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeBtn.innerHTML = savedTheme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';

        themeBtn.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme') || 'light';
          const next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('cliniportal_theme', next);
          themeBtn.innerHTML = next === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        });
      }

      // If module is blocked under file:/// protocol, dynamically load IIFE bundle
      setTimeout(() => {
        const rootEl = document.getElementById('root');
        if (rootEl && rootEl.children.length === 0) {
          console.info('Module blocked or pending, activating standalone IIFE bundle...');
          const s = document.createElement('script');
          s.src = './assets/ecg-app.iife.js';
          document.body.appendChild(s);
        }
      }, 300);
    });
  </script>
