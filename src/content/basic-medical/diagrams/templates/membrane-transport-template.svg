<svg class="flowchart-editorial-svg" viewBox="0 0 940 460" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif">
  <defs>
    <marker id="mt-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="mt-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="mt-arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="mt-arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b5cf6" />
    </marker>
  </defs>

  <!-- Background Environment Labels -->
  <!-- ECF Zone (Top) -->
  <rect x="20" y="20" width="900" height="120" rx="8" fill="rgba(2, 132, 199, 0.04)" />
  <text x="40" y="45" font-size="13" font-weight="700" fill="#0284c7">
    DỊCH NGOẠI BÀO [ECF] (Nồng độ cao: Na⁺ 142 mEq/L, Cl⁻ 103 mEq/L, Ca²⁺ 2.4 mEq/L, Glucose)
  </text>

  <!-- Phospholipid Bilayer Membrane (Middle Zone, y: 150 to 270) -->
  <rect x="20" y="150" width="900" height="120" fill="rgba(100, 116, 139, 0.08)" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4" />
  <rect x="25" y="195" width="135" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text x="92" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">
    MÀNG LIPID KÉP
  </text>
  <text x="92" y="235" text-anchor="middle" font-size="9" font-weight="500" fill="#64748b">
    (Dày 7.5 – 10 nm)
  </text>

  <!-- Hydrophilic Heads (Top and Bottom Rows) -->
  <!-- We draw representative circles for phospholipid heads -->
  <g fill="#0284c7" opacity="0.85">
    <circle cx="180" cy="160" r="7"/><circle cx="200" cy="160" r="7"/><circle cx="220" cy="160" r="7"/>
    <circle cx="340" cy="160" r="7"/><circle cx="360" cy="160" r="7"/><circle cx="380" cy="160" r="7"/>
    <circle cx="560" cy="160" r="7"/><circle cx="580" cy="160" r="7"/><circle cx="600" cy="160" r="7"/>
    <circle cx="760" cy="160" r="7"/><circle cx="780" cy="160" r="7"/><circle cx="800" cy="160" r="7"/>

    <circle cx="180" cy="260" r="7"/><circle cx="200" cy="260" r="7"/><circle cx="220" cy="260" r="7"/>
    <circle cx="340" cy="260" r="7"/><circle cx="360" cy="260" r="7"/><circle cx="380" cy="260" r="7"/>
    <circle cx="560" cy="260" r="7"/><circle cx="580" cy="260" r="7"/><circle cx="600" cy="260" r="7"/>
    <circle cx="760" cy="260" r="7"/><circle cx="780" cy="260" r="7"/><circle cx="800" cy="260" r="7"/>
  </g>

  <!-- ICF Zone (Bottom) -->
  <rect x="20" y="280" width="900" height="160" rx="8" fill="rgba(16, 185, 129, 0.04)" />
  <text x="40" y="425" font-size="13" font-weight="700" fill="#059669">
    DỊCH NỘI BÀO [ICF] (Nồng độ cao: K⁺ 140 mEq/L, Mg²⁺ 58 mEq/L, Protein⁻, Phosphates | Vm = -70 đến -90 mV)
  </text>

  <!-- 4 TRANSPORT MECHANISM LANES -->
  <!-- Lane 1: Simple Diffusion (Khuếch tán đơn thuần) -->
  <g id="mechanism-simple">
    <rect x="170" y="65" width="80" height="30" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <text x="210" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#0284c7">O₂, CO₂, Lipid</text>
    
    <!-- Arrow straight through membrane -->
    <path d="M 210 100 L 210 320" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#mt-arrow-blue)" />
    
    <rect x="160" y="335" width="100" height="50" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <text x="210" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#0284c7">KHUẾCH TÁN</text>
    <text x="210" y="369" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">Đơn Thuần (Fick)</text>
    <text x="210" y="381" text-anchor="middle" font-size="8" font-weight="500" fill="#64748b">Không tốn ATP</text>
  </g>

  <!-- Lane 2: Facilitated Diffusion (GLUT) -->
  <g id="mechanism-facilitated">
    <rect x="330" y="65" width="90" height="30" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
    <text x="375" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">Glucose (ECF)</text>
    
    <!-- Carrier Protein in membrane -->
    <rect x="345" y="165" width="60" height="90" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#059669" stroke-width="2" />
    <text x="375" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">GLUT</text>
    
    <path d="M 375 100 L 375 160" fill="none" stroke="#059669" stroke-width="2" />
    <path d="M 375 260 L 375 320" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#mt-arrow-green)" />
    
    <rect x="325" y="335" width="100" height="50" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
    <text x="375" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">KHUẾCH TÁN</text>
    <text x="375" y="369" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">Có Hỗ Trợ (Carrier)</text>
    <text x="375" y="381" text-anchor="middle" font-size="8" font-weight="500" fill="#059669">Đạt Vmax bão hòa</text>
  </g>

  <!-- Lane 3: Primary Active Transport (Na+/K+-ATPase) -->
  <g id="mechanism-primary">
    <!-- Pump Carrier Protein -->
    <rect x="525" y="155" width="110" height="110" rx="16" fill="rgba(217, 119, 6, 0.12)" stroke="#d97706" stroke-width="2" />
    <text x="580" y="195" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">BƠM Na⁺/K⁺</text>
    <text x="580" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">ATPase</text>
    <text x="580" y="235" text-anchor="middle" font-size="8" font-weight="600" fill="#d97706">Tiêu tốn 1 ATP</text>
    
    <!-- 3 Na+ out arrow -->
    <path d="M 550 280 L 550 110" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#mt-arrow-red)" />
    <rect x="515" y="70" width="70" height="26" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1" />
    <text x="550" y="87" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">3 Na⁺ Ra ECF</text>
    
    <!-- 2 K+ in arrow -->
    <path d="M 610 110 L 610 320" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#mt-arrow-green)" />
    <rect x="575" y="335" width="70" height="26" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1" />
    <text x="610" y="352" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">2 K⁺ Vào ICF</text>
    
    <rect x="525" y="370" width="110" height="35" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1" />
    <text x="580" y="386" text-anchor="middle" font-size="9" font-weight="700" fill="#d97706">CHỦ ĐỘNG NGUYÊN PHÁT</text>
    <text x="580" y="399" text-anchor="middle" font-size="8" font-weight="500" fill="#64748b">Ngược Gradient Điện Hóa</text>
  </g>

  <!-- Lane 4: Secondary Active Transport (SGLT & NCX) -->
  <g id="mechanism-secondary">
    <rect x="745" y="155" width="110" height="110" rx="16" fill="rgba(139, 92, 246, 0.12)" stroke="#8b5cf6" stroke-width="2" />
    <text x="800" y="195" text-anchor="middle" font-size="11" font-weight="700" fill="#8b5cf6">ĐỒNG / ĐỐI VẬN</text>
    <text x="800" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="#8b5cf6">SGLT / NCX</text>
    <text x="800" y="235" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">Mượn thế năng Na⁺</text>
    
    <!-- Symport Arrows (both down) -->
    <path d="M 770 105 L 770 320" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#mt-arrow-blue)" />
    <path d="M 830 105 L 830 320" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#mt-arrow-purple)" />
    
    <rect x="735" y="70" width="130" height="26" rx="5" fill="#ffffff" stroke="#8b5cf6" stroke-width="1" />
    <text x="800" y="87" text-anchor="middle" font-size="10" font-weight="700" fill="#8b5cf6">Na⁺ + Glucose (SGLT)</text>
    
    <rect x="735" y="350" width="130" height="40" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" />
    <text x="800" y="367" text-anchor="middle" font-size="9" font-weight="700" fill="#8b5cf6">CHỦ ĐỘNG THỨ PHÁT</text>
    <text x="800" y="381" text-anchor="middle" font-size="8" font-weight="500" fill="#64748b">Đích tác dụng SGLT2i</text>
  </g>
</svg>
