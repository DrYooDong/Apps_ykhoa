<svg class="flowchart-editorial-svg" viewBox="0 0 920 440" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif">
  <defs>
    <marker id="fb-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="fb-arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="fb-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Title / Concept Banner -->
  <rect x="260" y="15" width="400" height="42" rx="21" fill="rgba(16, 185, 129, 0.1)" stroke="#059669" stroke-width="1.5" />
  <text x="460" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">
    CƠ CHẾ ĐIỀU HÒA NGƯỢC ÂM TÍNH (NEGATIVE FEEDBACK)
  </text>

  <!-- 1. STIMULUS / PERTURBATION (Left) -->
  <g id="node-stimulus">
    <rect x="40" y="100" width="190" height="70" rx="12" fill="rgba(239, 68, 68, 0.08)" stroke="#dc2626" stroke-width="2" />
    <text x="135" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">1. KÍCH THÍCH (Stimulus)</text>
    <text x="135" y="148" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">Lệch khỏi giá trị cân bằng</text>
    <text x="135" y="162" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">(VD: Huyết áp tăng vọt)</text>
  </g>

  <!-- Arrow: Stimulus -> Receptor -->
  <path d="M 230 135 L 268 135" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#fb-arrow-blue)" />

  <!-- 2. RECEPTOR / SENSOR -->
  <g id="node-receptor">
    <rect x="270" y="100" width="190" height="70" rx="12" fill="rgba(2, 132, 199, 0.08)" stroke="#0284c7" stroke-width="2" />
    <text x="365" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0284c7">2. THỤ THỂ (Sensor)</text>
    <text x="365" y="148" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">Phát hiện biến đổi nội môi</text>
    <text x="365" y="162" text-anchor="middle" font-size="10" font-weight="600" fill="#0284c7">(VD: Xoang cảnh, Quai ĐMC)</text>
  </g>

  <!-- Arrow: Receptor -> Center (Afferent Signal) -->
  <path d="M 460 135 L 498 135" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#fb-arrow-blue)" />
  <rect x="462" y="112" width="34" height="16" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" />
  <text x="479" y="123" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b">IX, X</text>

  <!-- 3. CONTROL CENTER (Center Box) -->
  <g id="node-center">
    <rect x="500" y="85" width="200" height="100" rx="14" fill="rgba(245, 158, 11, 0.09)" stroke="#d97706" stroke-width="2" />
    <text x="600" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">3. TRUNG TÂM TÍCH HỢP</text>
    <text x="600" y="133" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">So sánh với Điểm Đặt (Set-Point)</text>
    <text x="600" y="151" text-anchor="middle" font-size="10" font-weight="500" fill="#64748b">Phân tích &amp; Ra quyết định điều hòa</text>
    <text x="600" y="169" text-anchor="middle" font-size="10" font-weight="700" fill="#d97706">(VD: Hành não / Trung tâm vận mạch)</text>
  </g>

  <!-- Arrow: Center -> Effector (Efferent Pathway) -->
  <path d="M 600 185 L 600 238" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#fb-arrow-blue)" />

  <!-- 4. EFFECTOR (Cơ quan đáp ứng) -->
  <g id="node-effector">
    <rect x="490" y="240" width="220" height="74" rx="12" fill="rgba(2, 132, 199, 0.08)" stroke="#0284c7" stroke-width="2" />
    <text x="600" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#0284c7">4. CƠ QUAN ĐÁP ỨNG (Effector)</text>
    <text x="600" y="286" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">Thực thi tín hiệu ly tâm điều chỉnh</text>
    <text x="600" y="302" text-anchor="middle" font-size="10" font-weight="600" fill="#0284c7">(VD: Tim đập chậm, Giãn mạch máu)</text>
  </g>

  <!-- Arrow: Effector -> Response -->
  <path d="M 490 277 L 240 277" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#fb-arrow-green)" />

  <!-- 5. RESPONSE / RESTORATION -->
  <g id="node-response">
    <rect x="40" y="240" width="190" height="74" rx="12" fill="rgba(16, 185, 129, 0.08)" stroke="#059669" stroke-width="2" />
    <text x="135" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">5. ĐÁP ỨNG ĐIỀU HÒA</text>
    <text x="135" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">Huyết áp hạ về bình thường</text>
    <text x="135" y="302" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">Khôi phục trạng thái nội môi</text>
  </g>

  <!-- 6. NEGATIVE FEEDBACK INHIBITORY LOOP (Long arrow back to Stimulus) -->
  <path d="M 135 314 L 135 390 Q 135 400 125 400 L 25 400 Q 15 400 15 390 L 15 145 Q 15 135 25 135 L 38 135" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#fb-arrow-red)" />
  
  <!-- Label on Loop: ỨC CHẾ KÍCH THÍCH BAN ĐẦU (-) -->
  <rect x="60" y="388" width="220" height="24" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1" />
  <text x="170" y="404" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">
    (-) PHẢN HỒI ÂM TÍNH (Triệt tiêu kích thích)
  </text>
</svg>
