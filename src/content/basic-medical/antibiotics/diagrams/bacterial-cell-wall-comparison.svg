<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:var(--color-surface, #ffffff); border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="gplusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="gminusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Title & Header -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="900" fill="var(--color-text, #0f172a)">
    SO SÁNH CẤU TRÚC VÁCH TẾ BÀO VI KHUẨN GRAM DƯƠNG VÀ GRAM ÂM
  </text>
  <text x="480" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-text-muted, #64748b)">
    Cơ sở giải phẫu phân tử giải thích tính nhạy cảm và kháng tự nhiên của kháng sinh
  </text>

  <!-- LEFT PANEL: GRAM POSITIVE -->
  <g transform="translate(40, 85)">
    <!-- Container -->
    <rect x="0" y="0" width="420" height="360" rx="12" fill="url(#gplusGrad)" stroke="#3b82f6" stroke-width="1.5" />
    
    <!-- Header Badge -->
    <rect x="15" y="15" width="390" height="36" rx="8" fill="#3b82f6" />
    <text x="210" y="38" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">
      VI KHUẨN GRAM DƯƠNG (GRAM-POSITIVE)
    </text>

    <!-- Peptidoglycan Layer (Thick) -->
    <rect x="25" y="65" width="370" height="150" rx="6" fill="#60a5fa" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" />
    <text x="210" y="105" text-anchor="middle" font-size="15" font-weight="800" fill="#1e40af">
      LỚP PEPTIDOGLYCAN RẤT DÀY (20 - 80 nm)
    </text>
    <text x="210" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">
      40 - 80 lớp lưới murein đa tầng
    </text>
    <text x="210" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">
      Chứa Acid Teichoic &amp; Lipoteichoic tích điện âm
    </text>
    
    <!-- Target Badge -->
    <rect x="40" y="170" width="340" height="32" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1" />
    <text x="210" y="191" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">
      🎯 ĐÍCH TÁC ĐỘNG: Beta-lactam &amp; Glycopeptide (Vancomycin)
    </text>

    <!-- Periplasmic Space (Small) -->
    <rect x="25" y="225" width="370" height="20" rx="3" fill="#cbd5e1" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1" />
    <text x="210" y="239" text-anchor="middle" font-size="11" font-weight="600" fill="var(--color-text, #334155)">
      Khoang chu chất hẹp (Periplasmic space)
    </text>

    <!-- Inner Plasma Membrane -->
    <rect x="25" y="255" width="370" height="40" rx="6" fill="#f59e0b" fill-opacity="0.35" stroke="#d97706" stroke-width="1.5" />
    <text x="210" y="280" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">
      MÀNG TẾ BÀO CHẤT (MÀNG ĐÔI PHOSPHOLIPID)
    </text>

    <!-- Footer Summary -->
    <text x="210" y="325" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--color-text, #0f172a)">
      Đặc tính: Bắt màu TÍM nhuộm Gram • Không có màng ngoài
    </text>
    <text x="210" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="var(--color-text-muted, #64748b)">
      Đại diện: Tụ cầu (Staphylococcus), Liên cầu (Streptococcus)
    </text>
  </g>

  <!-- RIGHT PANEL: GRAM NEGATIVE -->
  <g transform="translate(500, 85)">
    <!-- Container -->
    <rect x="0" y="0" width="420" height="360" rx="12" fill="url(#gminusGrad)" stroke="#ef4444" stroke-width="1.5" />
    
    <!-- Header Badge -->
    <rect x="15" y="15" width="390" height="36" rx="8" fill="#ef4444" />
    <text x="210" y="38" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">
      VI KHUẨN GRAM ÂM (GRAM-NEGATIVE)
    </text>

    <!-- Outer Membrane with LPS -->
    <rect x="25" y="65" width="370" height="60" rx="6" fill="#f87171" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.5" />
    <text x="210" y="88" text-anchor="middle" font-size="13.5" font-weight="800" fill="#991b1b">
      MÀNG NGOÀI (OUTER MEMBRANE) VỚI LPS
    </text>
    <text x="210" y="108" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">
      Chứa Kháng nguyên O, Kháng nguyên lõi &amp; Lipid A (Nội độc tố)
    </text>

    <!-- Porin Channels Badge -->
    <rect x="40" y="132" width="340" height="26" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1" />
    <text x="210" y="149" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">
      🚪 CỔNG PORIN: Rào cản thẩm thấu phân tử kháng sinh
    </text>

    <!-- Periplasmic Space (Wide) & Peptidoglycan (Thin) -->
    <rect x="25" y="165" width="370" height="50" rx="6" fill="#cbd5e1" fill-opacity="0.45" stroke="#94a3b8" stroke-width="1" />
    <!-- Thin peptidoglycan line -->
    <rect x="35" y="183" width="350" height="12" rx="3" fill="#60a5fa" stroke="#2563eb" stroke-width="1" />
    <text x="210" y="178" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--color-text, #334155)">
      Khoang chu chất rộng (Chứa men Beta-lactamase bảo vệ)
    </text>
    <text x="210" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">
      Lớp Peptidoglycan rất mỏng (2 - 7 nm, 1-2 lớp)
    </text>

    <!-- Inner Plasma Membrane -->
    <rect x="25" y="225" width="370" height="40" rx="6" fill="#f59e0b" fill-opacity="0.35" stroke="#d97706" stroke-width="1.5" />
    <text x="210" y="250" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">
      MÀNG TẾ BÀO CHẤT (MÀNG TRONG)
    </text>

    <!-- Target Badge -->
    <rect x="40" y="272" width="340" height="30" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1" />
    <text x="210" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">
      ⚠️ KHÁNG TỰ NHIÊN: Vancomycin không qua được kênh Porin!
    </text>

    <!-- Footer Summary -->
    <text x="210" y="325" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--color-text, #0f172a)">
      Đặc tính: Bắt màu HỒNG/ĐỎ • Đột biến Porin gây kháng thuốc
    </text>
    <text x="210" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="var(--color-text-muted, #64748b)">
      Đại diện: E. coli, Klebsiella, Trực khuẩn mủ xanh (Pseudomonas)
    </text>
  </g>
</svg>

