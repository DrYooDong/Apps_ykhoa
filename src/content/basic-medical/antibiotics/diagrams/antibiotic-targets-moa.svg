<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:var(--color-surface, #ffffff); border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <!-- Title & Header -->
  <text x="500" y="38" text-anchor="middle" font-size="21" font-weight="900" fill="var(--color-text, #0f172a)">
    5 ĐÍCH TÁC ĐỘNG PHÂN TỬ CỦA KHÁNG SINH TRÊN TẾ BÀO VI KHUẨN
  </text>
  <text x="500" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-text-muted, #64748b)">
    Tính độc chọn lọc (Selective Toxicity) dựa trên sự khác biệt giữa tế bào Prokaryote và Eukaryote
  </text>

  <!-- TARGET 1: CELL WALL SYNTHESIS (Top Left) -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="295" height="195" rx="10" fill="rgba(2, 132, 199, 0.08)" stroke="#0284c7" stroke-width="1.5" />
    <rect x="12" y="12" width="271" height="30" rx="6" fill="#0284c7" />
    <text x="147" y="32" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">
      1. ỨC CHẾ TỔNG HỢP VÁCH TẾ BÀO
    </text>
    <text x="147" y="65" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--color-text, #0f172a)">
      Đích: Enzym Transpeptidase (PBP) &amp; D-Ala-D-Ala
    </text>
    <line x1="20" y1="78" x2="275" y2="78" stroke="var(--color-border, #cbd5e1)" stroke-width="1" />
    <text x="25" y="98" font-size="11" font-weight="700" fill="#0284c7">• Nhóm Beta-lactam:</text>
    <text x="35" y="115" font-size="10.5" font-weight="500" fill="var(--color-text-muted, #64748b)">Penicillins, Cephalosporins, Carbapenems</text>
    <text x="25" y="135" font-size="11" font-weight="700" fill="#0284c7">• Nhóm Glycopeptides:</text>
    <text x="35" y="152" font-size="10.5" font-weight="500" fill="var(--color-text-muted, #64748b)">Vancomycin, Teicoplanin</text>
    <text x="25" y="175" font-size="11" font-weight="700" fill="#059669">✓ Tác dụng: Diệt khuẩn (Bactericidal)</text>
  </g>

  <!-- TARGET 2: PROTEIN SYNTHESIS 30S & 50S (Top Center) -->
  <g transform="translate(350, 85)">
    <rect x="0" y="0" width="300" height="195" rx="10" fill="rgba(139, 92, 246, 0.08)" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="12" y="12" width="276" height="30" rx="6" fill="#8b5cf6" />
    <text x="150" y="32" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">
      2. ỨC CHẾ TỔNG HỢP PROTEIN (RIBOSOME)
    </text>
    <text x="150" y="65" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--color-text, #0f172a)">
      Đích: Tiểu phần 30S hoặc 50S Ribosome vi khuẩn
    </text>
    <line x1="20" y1="78" x2="280" y2="78" stroke="var(--color-border, #cbd5e1)" stroke-width="1" />
    <text x="25" y="98" font-size="11" font-weight="700" fill="#7c3aed">• Ức chế tiểu phần 30S:</text>
    <text x="35" y="115" font-size="10.5" font-weight="500" fill="var(--color-text-muted, #64748b)">Aminoglycosides (diệt khuẩn), Tetracyclines</text>
    <text x="25" y="135" font-size="11" font-weight="700" fill="#7c3aed">• Ức chế tiểu phần 50S:</text>
    <text x="35" y="152" font-size="10.5" font-weight="500" fill="var(--color-text-muted, #64748b)">Macrolides, Clindamycin, Linezolid, Cloramphenicol</text>
    <text x="25" y="175" font-size="11" font-weight="700" fill="#d97706">✓ Đa số kìm khuẩn (Trừ Aminoglycoside)</text>
  </g>

  <!-- TARGET 3: NUCLEIC ACID SYNTHESIS (Top Right) -->
  <g transform="translate(675, 85)">
    <rect x="0" y="0" width="295" height="195" rx="10" fill="rgba(239, 68, 68, 0.08)" stroke="#ef4444" stroke-width="1.5" />
    <rect x="12" y="12" width="271" height="30" rx="6" fill="#ef4444" />
    <text x="147" y="32" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">
      3. ỨC CHẾ TỔNG HỢP ACID NUCLEIC
    </text>
    <text x="147" y="65" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--color-text, #0f172a)">
      Đích: DNA Gyrase (Topoisomerase II/IV) &amp; RNA Pol
    </text>
    <line x1="20" y1="78" x2="275" y2="78" stroke="var(--color-border, #cbd5e1)" stroke-width="1" />
    <text x="25" y="98" font-size="11" font-weight="700" fill="#dc2626">• Nhóm Fluoroquinolones:</text>
    <text x="35" y="115" font-size="10.5" font-weight="500" fill="var(--color-text-muted, #64748b)">Ciprofloxacin, Levofloxacin, Moxifloxacin</text>
    <text x="25" y="135" font-size="11" font-weight="700" fill="#dc2626">• Nhóm Rifamycins:</text>
    <text x="35" y="152" font-size="10.5" font-weight="500" fill="var(--color-text-muted, #64748b)">Rifampicin (Ức chế RNA Polymerase)</text>
    <text x="25" y="175" font-size="11" font-weight="700" fill="#059669">✓ Tác dụng: Diệt khuẩn nồng độ phụ thuộc</text>
  </g>

  <!-- TARGET 4: FOLIC ACID METABOLISM (Bottom Left) -->
  <g transform="translate(190, 300)">
    <rect x="0" y="0" width="300" height="195" rx="10" fill="rgba(245, 158, 11, 0.08)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="12" y="12" width="276" height="30" rx="6" fill="#f59e0b" />
    <text x="150" y="32" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">
      4. ỨC CHẾ CHUYỂN HÓA FOLIC ACID
    </text>
    <text x="150" y="65" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--color-text, #0f172a)">
      Đích: Dihydropteroate Synthase &amp; DHFR
    </text>
    <line x1="20" y1="78" x2="280" y2="78" stroke="var(--color-border, #cbd5e1)" stroke-width="1" />
    <text x="25" y="98" font-size="11" font-weight="700" fill="#d97706">• Sulfamethoxazole (SMX):</text>
    <text x="35" y="115" font-size="10.5" font-weight="500" fill="var(--color-text-muted, #64748b)">Cạnh tranh với PABA trong tổng hợp Dihydrofolate</text>
    <text x="25" y="135" font-size="11" font-weight="700" fill="#d97706">• Trimethoprim (TMP):</text>
    <text x="35" y="152" font-size="10.5" font-weight="500" fill="var(--color-text-muted, #64748b)">Ức chế enzym Dihydrofolate Reductase (DHFR)</text>
    <text x="25" y="175" font-size="11" font-weight="700" fill="#059669">✓ Đơn độc: Kìm khuẩn • Phối hợp Co-trimoxazole: Diệt khuẩn</text>
  </g>

  <!-- TARGET 5: CELL MEMBRANE DISRUPTORS (Bottom Right) -->
  <g transform="translate(515, 300)">
    <rect x="0" y="0" width="300" height="195" rx="10" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="1.5" />
    <rect x="12" y="12" width="276" height="30" rx="6" fill="#10b981" />
    <text x="150" y="32" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">
      5. PHÁ HỦY MÀNG TẾ BÀO CHẤT
    </text>
    <text x="150" y="65" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--color-text, #0f172a)">
      Đích: Phospholipid màng tế bào vi khuẩn
    </text>
    <line x1="20" y1="78" x2="280" y2="78" stroke="var(--color-border, #cbd5e1)" stroke-width="1" />
    <text x="25" y="98" font-size="11" font-weight="700" fill="#059669">• Nhóm Polymyxins (Colistin, Polymyxin B):</text>
    <text x="35" y="115" font-size="10.5" font-weight="500" fill="var(--color-text-muted, #64748b)">Hoạt động như chất diện hoạt phá hủy màng ngoài Gram (-)</text>
    <text x="25" y="135" font-size="11" font-weight="700" fill="#059669">• Nhóm Lipopeptides (Daptomycin):</text>
    <text x="35" y="152" font-size="10.5" font-weight="500" fill="var(--color-text-muted, #64748b)">Khử cực màng tế bào vi khuẩn Gram (+)</text>
    <text x="25" y="175" font-size="11" font-weight="700" fill="#dc2626">✓ Tác dụng: Diệt khuẩn cực nhanh (Độc tính cao)</text>
  </g>
</svg>

