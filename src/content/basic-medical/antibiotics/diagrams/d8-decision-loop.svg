<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:var(--color-surface, #ffffff); border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <!-- Title & Header -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="900" fill="var(--color-text, #0f172a)">
    VÒNG TRÒN 8 BƯỚC KÊ ĐƠN AN TOÀN (D8 PRESCRIBING SAFETY LOOP)
  </text>
  <text x="450" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-text-muted, #64748b)">
    Quy trình kiểm soát chất lượng kê đơn kháng sinh toàn diện trước khi ký bút và xuất viện
  </text>

  <!-- Central Circle Loop Group -->
  <g transform="translate(450, 290)">
    <!-- Main Center Hub -->
    <circle cx="0" cy="0" r="85" fill="rgba(2, 132, 199, 0.1)" stroke="#0284c7" stroke-width="2.5" />
    <text x="0" y="-18" text-anchor="middle" font-size="20" font-weight="900" fill="#0284c7">D8 LOOP</text>
    <text x="0" y="5" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--color-text, #0f172a)">8 BƯỚC AN TOÀN</text>
    <text x="0" y="24" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--color-text-muted, #64748b)">Chống Lạm Dụng</text>
    <text x="0" y="40" text-anchor="middle" font-size="10" font-weight="700" fill="#10b981">AMS CLINICAL OS</text>

    <!-- 8 Nodes Placed on Circumference (Radius R = 185) -->
    <!-- Node 1: Top (0, -185) -->
    <g transform="translate(0, -185)">
      <circle cx="0" cy="0" r="30" fill="#0284c7" />
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">D1</text>
      <text x="0" y="-36" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0284c7">1. CHẨN ĐOÁN</text>
      <text x="0" y="-22" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--color-text-muted, #64748b)">Bằng chứng nhiễm khuẩn</text>
    </g>

    <!-- Node 2: Top Right (131, -131) -->
    <g transform="translate(131, -131)">
      <circle cx="0" cy="0" r="30" fill="#0284c7" />
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">D2</text>
      <text x="45" y="-12" font-size="11.5" font-weight="800" fill="#0284c7">2. Ổ NHIỄM KHUẨN</text>
      <text x="45" y="4" font-size="9.5" font-weight="600" fill="var(--color-text-muted, #64748b)">Mô đích cần ngấm thuốc</text>
    </g>

    <!-- Node 3: Right (185, 0) -->
    <g transform="translate(185, 0)">
      <circle cx="0" cy="0" r="30" fill="#8b5cf6" />
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">D3</text>
      <text x="45" y="-2" font-size="11.5" font-weight="800" fill="#7c3aed">3. VI SINH VẬT</text>
      <text x="45" y="14" font-size="9.5" font-weight="600" fill="var(--color-text-muted, #64748b)">Nhuộm Gram &amp; Cấy mẫu</text>
    </g>

    <!-- Node 4: Bottom Right (131, 131) -->
    <g transform="translate(131, 131)">
      <circle cx="0" cy="0" r="30" fill="#f59e0b" />
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">D4</text>
      <text x="45" y="8" font-size="11.5" font-weight="800" fill="#d97706">4. THUỐC TỐI ƯU</text>
      <text x="45" y="24" font-size="9.5" font-weight="600" fill="var(--color-text-muted, #64748b)">Ưu tiên nhóm ACCESS</text>
    </g>

    <!-- Node 5: Bottom (0, 185) -->
    <g transform="translate(0, 185)">
      <circle cx="0" cy="0" r="30" fill="#10b981" />
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">D5</text>
      <text x="0" y="46" text-anchor="middle" font-size="11.5" font-weight="800" fill="#059669">5. LIỀU THEO CrCl</text>
      <text x="0" y="60" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--color-text-muted, #64748b)">Chức năng Thận &amp; PK/PD</text>
    </g>

    <!-- Node 6: Bottom Left (-131, 131) -->
    <g transform="translate(-131, 131)">
      <circle cx="0" cy="0" r="30" fill="#06b6d4" />
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">D6</text>
      <text x="-45" y="8" text-anchor="end" font-size="11.5" font-weight="800" fill="#0891b2">6. ĐƯỜNG DÙNG</text>
      <text x="-45" y="24" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--color-text-muted, #64748b)">IV vs PO (F &gt; 90%)</text>
    </g>

    <!-- Node 7: Left (-185, 0) -->
    <g transform="translate(-185, 0)">
      <circle cx="0" cy="0" r="30" fill="#ec4899" />
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">D7</text>
      <text x="-45" y="-2" text-anchor="end" font-size="11.5" font-weight="800" fill="#db2777">7. THỜI GIAN DÙNG</text>
      <text x="-45" y="14" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--color-text-muted, #64748b)">Khóa ngày dừng (5-7 ngày)</text>
    </g>

    <!-- Node 8: Top Left (-131, -131) -->
    <g transform="translate(-131, -131)">
      <circle cx="0" cy="0" r="30" fill="#ef4444" />
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">D8</text>
      <text x="-45" y="-12" text-anchor="end" font-size="11.5" font-weight="800" fill="#dc2626">8. ĐÁNH GIÁ 48-72h</text>
      <text x="-45" y="4" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--color-text-muted, #64748b)">Timeout &amp; Xuống thang</text>
    </g>

    <!-- Connecting Circle with Arrows -->
    <circle cx="0" cy="0" r="185" fill="none" stroke="var(--color-border, #cbd5e1)" stroke-width="2" stroke-dasharray="8,6" />
  </g>
</svg>

