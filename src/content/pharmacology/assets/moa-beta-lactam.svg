<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" class="moa-svg-diagram">
  <defs>
    <linearGradient id="cellWallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="var(--color-bg, #0f172a)" rx="12"/>

  <!-- Title Section -->
  <text x="400" y="36" text-anchor="middle" fill="var(--color-primary, #38bdf8)" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">
    CƠ CHẾ TÁC DỤNG CỦA KHÁNG SINH BETA-LACTAM &amp; CHẤT ỨC CHẾ BETA-LACTAMASE
  </text>
  <text x="400" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">
    Click vào từng thành phần sơ đồ để xem chi tiết cơ chế phân tử
  </text>

  <!-- Cell Membrane / Wall Layers -->
  <rect x="60" y="280" width="680" height="40" fill="url(#cellWallGrad)" stroke="#0284c7" stroke-width="2" rx="6"/>
  <text x="400" y="305" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
    LỚP PEPTIDOGLYCAN THÀNH TẾ BÀO VI KHUẨN
  </text>

  <!-- Interactive Node 1: PBP Target Binding -->
  <g class="moa-node" id="node-pbp" data-title="Penicillin-Binding Proteins (PBP)" data-desc="PBP là enzym transpeptidase chịu trách nhiệm nối ngang chuỗi peptidoglycan. Amoxicillin gắn vào PBP làm ngưng trệ vĩnh viễn sự tháo xoắn và tổng hợp thành tế bào.">
    <circle cx="200" cy="180" r="45" fill="#e11d48" opacity="0.85" filter="url(#glowEffect)" class="interactive-circle"/>
    <text x="200" y="176" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">PBP Enzym</text>
    <text x="200" y="194" text-anchor="middle" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11">(Transpeptidase)</text>
  </g>

  <!-- Connection Line 1 -->
  <path d="M 200 225 L 200 280" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Interactive Node 2: Beta-Lactam Ring -->
  <g class="moa-node" id="node-drug" data-title="Vòng Beta-Lactam (Amoxicillin)" data-desc="Vòng Beta-Lactam có cấu trúc tương tự D-alanyl-D-alanine, đánh lừa enzym PBP gắn kết bất thuận nghịch.">
    <rect x="330" y="135" width="140" height="90" rx="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2" class="interactive-rect"/>
    <text x="400" y="170" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Amoxicillin</text>
    <text x="400" y="190" text-anchor="middle" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12">(Vòng Î²-Lactam)</text>
  </g>

  <!-- Interactive Node 3: Beta-Lactamase Inhibitor (Clavulanate) -->
  <g class="moa-node" id="node-inhibitor" data-title="Acid Clavulanic (Chất ức chế Ê²-Lactamase)" data-desc="Bẫy phân tử (Suicide Inhibitor): Acid Clavulanic giả làm vòng Î²-lactam để enzym Ê²-lactamase tiết ra từ vi khuẩn kháng thuốc gắn vào và bị bất hoạt, bảo vệ Amoxicillin.">
    <rect x="550" y="135" width="160" height="90" rx="10" fill="#d97706" stroke="#fbbf24" stroke-width="2" class="interactive-rect"/>
    <text x="630" y="165" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Acid Clavulanic</text>
    <text x="630" y="185" text-anchor="middle" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11">(Î²-Lactamase Trap)</text>
  </g>

  <!-- Interactive Node 4: Cell Lysis Result -->
  <g class="moa-node" id="node-lysis" data-title="Kết Quả: Tan Tế Bào Vi Khuẩn (Bacterial Lysis)" data-desc="Thành tế bào bị yếu, áp suất thẩm thấu nội bào cao làm vi khuẩn vỡ tan và bị tiêu diệt (Bactericidal Effect).">
    <rect x="250" y="350" width="300" height="50" rx="8" fill="#16a34a" stroke="#4ade80" stroke-width="2" class="interactive-rect"/>
    <text x="400" y="380" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">💥 TAN TẾ BÀO VI KHUẨN (BACTERICIDAL)</text>
  </g>
</svg>
