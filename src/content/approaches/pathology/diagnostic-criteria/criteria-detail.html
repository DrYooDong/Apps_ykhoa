<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chi tiết tiêu chuẩn chẩn đoán tương tác – CliniPortal">
  <title>Tiêu chuẩn Chẩn đoán – CliniPortal</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Base CliniPortal CSS -->
  <link rel="stylesheet" href="../../../../../css/reset.css">
  <link rel="stylesheet" href="../../../../../css/main.css">
  <!-- Module CSS -->
  <link rel="stylesheet" href="css/criteria.css">

  <script src="../../../../../js/main.js" defer></script>
</head>

<body class="dc-workspace-body">

  <!-- TOPBAR -->
  <header class="dc-topbar">
    <div class="dc-topbar-left">
      <a href="index.html" class="dc-back-btn" title="Trở về Ngân hàng Tiêu chuẩn">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Ngân hàng TC</span>
      </a>
      <div class="dc-brand">
        <span class="dc-brand-icon">📋</span>
        <span class="dc-brand-name" id="topbar-title-display">Tiêu chuẩn Chẩn đoán</span>
      </div>
    </div>
    <div class="dc-topbar-right">
      <button class="dc-theme-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Đổi chế độ Sáng / Tối">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
      </button>
    </div>
  </header>

  <!-- DETAIL CONTAINER -->
  <div class="dc-app-body">
    <div class="dc-detail-container" id="criteria-detail-container">
      <!-- Loading state -->
      <div class="dc-empty-state">
        <i class="fa-solid fa-spinner fa-spin dc-empty-state-icon" style="color:var(--color-primary)"></i>
        <p class="dc-empty-state-text">Đang tải tiêu chuẩn chẩn đoán...</p>
      </div>
    </div>
  </div>

  <script src="js/criteria-engine.js" defer></script>

</body>
</html>
