<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" class="physio-svg-diagram">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#ef4444"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="700">
    ⚡ Đường Cong Điện thế Hoạt động Thần kinh (Action Potential Curve)
  </text>
  <text x="400" y="60" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">
    Sự chuyển đổi nồng độ ion Na+, K+ và điện thế màng (mV)
  </text>

  <!-- Axes -->
  <!-- Y axis (mV) -->
  <line x1="80" y1="90" x2="80" y2="380" stroke="#475569" stroke-width="2"/>
  <!-- X axis (Time ms) -->
  <line x1="80" y1="380" x2="740" y2="380" stroke="#475569" stroke-width="2"/>

  <!-- Grid lines & Y Labels -->
  <!-- +30 mV -->
  <line x1="80" y1="120" x2="740" y2="120" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="70" y="125" text-anchor="end" fill="#f43f5e" font-family="sans-serif" font-size="12" font-weight="600">+30 mV</text>
  <text x="745" y="125" fill="#f43f5e" font-family="sans-serif" font-size="11">Đỉnh khử cực (Overshoot)</text>

  <!-- 0 mV -->
  <line x1="80" y1="180" x2="740" y2="180" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="70" y="185" text-anchor="end" fill="#cbd5e1" font-family="sans-serif" font-size="12">0 mV</text>

  <!-- Threshold -55 mV -->
  <line x1="80" y1="285" x2="740" y2="285" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="70" y="290" text-anchor="end" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="600">-55 mV</text>
  <text x="745" y="290" fill="#f59e0b" font-family="sans-serif" font-size="11">Ngưỡng kích thích (Threshold)</text>

  <!-- Resting -70 mV -->
  <line x1="80" y1="330" x2="740" y2="330" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="70" y="335" text-anchor="end" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">-70 mV</text>
  <text x="745" y="335" fill="#38bdf8" font-family="sans-serif" font-size="11">Điện thế màng nghỉ (RMP)</text>

  <!-- Hyperpolarization -90 mV -->
  <line x1="80" y1="365" x2="740" y2="365" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="70" y="369" text-anchor="end" fill="#818cf8" font-family="sans-serif" font-size="11">-90 mV</text>

  <!-- Action Potential Curve -->
  <!-- Path: Start (80,330) -> Stimulus (150,330) -> Threshold (180,285) -> Depolarize Peak (270,120) -> Repolarize (440,330) -> Hyperpolarize (520,365) -> Recovery (650,330) -->
  <path d="M 80 330 L 150 330 Q 165 320 180 285 L 270 120 Q 285 110 300 130 L 440 330 Q 480 370 540 365 Q 600 355 650 330 L 740 330" 
        fill="none" stroke="url(#lineGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Step Annotations -->
  <!-- Step 1: Resting -->
  <circle cx="115" cy="330" r="6" fill="#38bdf8"/>
  <text x="115" y="310" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">1. Trạng thái nghỉ</text>

  <!-- Step 2: Depolarization -->
  <circle cx="225" cy="200" r="6" fill="#ef4444"/>
  <text x="225" y="175" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="bold">2. Khử cực (Na+ vào)</text>

  <!-- Step 3: Repolarization -->
  <circle cx="370" cy="230" r="6" fill="#10b981"/>
  <text x="410" y="210" text-anchor="start" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">3. Tái cực (K+ ra)</text>

  <!-- Step 4: Hyperpolarization -->
  <circle cx="530" cy="365" r="6" fill="#6366f1"/>
  <text x="530" y="402" text-anchor="middle" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="bold">4. Ưu cực (Hyperpolarization)</text>

  <!-- Ion Flow Cards at bottom -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="80" y="17" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11">🔓 Kênh Na+ mở nhanh</text>
  </g>
  <g transform="translate(320, 410)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="80" y="17" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11">🔒 Na+ đóng, 🔓 K+ mở</text>
  </g>
  <g transform="translate(540, 410)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="17" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11">⚙️ Bơm Na+-K+ phục hồi</text>
  </g>
</svg>
