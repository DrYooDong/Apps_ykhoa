<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="grad-earth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="grad-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="grad-water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Title & Background Ring -->
  <circle cx="300" cy="300" r="210" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Tương Sinh Outer Arc Paths -->
  <!-- Fire (300, 90) -> Earth (490, 230) -> Metal (420, 470) -> Water (180, 470) -> Wood (110, 230) -> Fire -->
  <path d="M 300 90 A 210 210 0 0 1 490 230" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 490 230 A 210 210 0 0 1 420 470" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 420 470 A 210 210 0 0 1 180 470" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 180 470 A 210 210 0 0 1 110 230" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 110 230 A 210 210 0 0 1 300 90" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Tương Khắc Inner Star Lines -->
  <!-- Wood (110, 230) -> Earth (490, 230) -> Water (180, 470) -> Fire (300, 90) -> Metal (420, 470) -> Wood (110, 230) -->
  <line x1="110" y1="230" x2="490" y2="230" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>
  <line x1="490" y1="230" x2="180" y2="470" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>
  <line x1="180" y1="470" x2="300" y2="90" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>
  <line x1="300" y1="90" x2="420" y2="470" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>
  <line x1="420" y1="470" x2="110" y2="230" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>

  <!-- Five Element Nodes -->
  <!-- Hỏa (Top) -->
  <g transform="translate(300, 90)">
    <circle r="40" fill="url(#grad-fire)"/>
    <text y="-5" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">🔥 HỎA</text>
    <text y="15" text-anchor="middle" fill="#fee2e2" font-size="12">Tâm / Hạ</text>
  </g>

  <!-- Thổ (Top Right) -->
  <g transform="translate(490, 230)">
    <circle r="40" fill="url(#grad-earth)"/>
    <text y="-5" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">⛰️ THỔ</text>
    <text y="15" text-anchor="middle" fill="#fef3c7" font-size="12">Tỳ / Trung</text>
  </g>

  <!-- Kim (Bottom Right) -->
  <g transform="translate(420, 470)">
    <circle r="40" fill="url(#grad-metal)"/>
    <text y="-5" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">⚔️ KIM</text>
    <text y="15" text-anchor="middle" fill="#f4f4f5" font-size="12">Phế / Thu</text>
  </g>

  <!-- Thủy (Bottom Left) -->
  <g transform="translate(180, 470)">
    <circle r="40" fill="url(#grad-water)"/>
    <text y="-5" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">💧 THỦY</text>
    <text y="15" text-anchor="middle" fill="#dbeafe" font-size="12">Thận / Đông</text>
  </g>

  <!-- Mộc (Top Left) -->
  <g transform="translate(110, 230)">
    <circle r="40" fill="url(#grad-wood)"/>
    <text y="-5" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">🌲 MỘC</text>
    <text y="15" text-anchor="middle" fill="#d1fae5" font-size="12">Can / Xuân</text>
  </g>

  <!-- Center Yin Yang Symbol -->
  <g transform="translate(300, 300)">
    <circle r="30" fill="#000"/>
    <path d="M 0 -30 A 30 30 0 0 1 0 30 A 15 15 0 0 1 0 0 A 15 15 0 0 0 0 -30" fill="#fff"/>
    <circle cx="0" cy="-15" r="5" fill="#000"/>
    <circle cx="0" cy="15" r="5" fill="#fff"/>
  </g>
</svg>
