<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  
  <!-- Subtle Inner Ring -->
  <rect x="32" y="32" width="448" height="448" rx="90" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Medical Cross & Pulse Graphic Group -->
  <g filter="url(#shadow)" transform="translate(0, 0)">
    <!-- White Medical Cross Base -->
    <rect x="216" y="112" width="80" height="288" rx="20" fill="#ffffff"/>
    <rect x="112" y="216" width="288" height="80" rx="20" fill="#ffffff"/>
    
    <!-- Heartbeat / ECG Pulse Line in Primary Color Overlay -->
    <path d="M 120 256 L 190 256 L 210 205 L 235 307 L 260 175 L 285 280 L 305 240 L 325 256 L 392 256" 
          fill="none" 
          stroke="#0284c7" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
